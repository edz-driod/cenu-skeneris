name: Telegram komandas

# Ik pēc ~5 min pārbauda, vai botam atsūtīta komanda (/skenet, /statuss).
# GitHub grafiku mēdz aizkavēt, tāpēc atbilde var pienākt pēc 5–15 min.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write     # lai varētu palaist scan.yml
  contents: read

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  komandas:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tg_komandas.py
          sparse-checkout-cone-mode: false
      - run: python3 tg_komandas.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GH_TOKEN: ${{ github.token }}
