name: Cenu skenēšana

on:
  schedule:
    - cron: "37 6 * * 1-5"    # darbdienās; UTC -> 8:37 ziemā, 9:37 vasarā pēc Rīgas laika (GitHub mēdz kavēties 10–30 min)
  workflow_dispatch:          # ļauj palaist arī ar roku no Actions cilnes
    inputs:
      operatori:
        description: "Kurus operatorus skenēt (piem. bite,tele2,lmt,tet)"
        required: false
        default: "bite,tele2,lmt,tet"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Skenē cenas
        run: python scan.py
        env:
          OPERATORI: ${{ inputs.operatori || 'bite,tele2,lmt,tet' }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }} # Tele2 iet caur Bright Data (sk. README)
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}

      - name: Saglabā datus repozitorijā
        if: always()
        run: |
          git config user.name "cenu-bots"
          git config user.email "cenu-bots@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Cenas $(date -u +'%Y-%m-%d %H:%M')"
          # kamēr skenēja, repozitorijā var būt nonākušas citas izmaiņas (piem. Tele2 no datora)
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
