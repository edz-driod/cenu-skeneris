name: Cenu skenēšana

on:
  schedule:
    - cron: "17 5,15 * * *"   # UTC -> ~8:17 un 18:17 pēc Rīgas laika (ziemā 7:17/17:17)
  workflow_dispatch:          # ļauj palaist arī ar roku no Actions cilnes

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Skenē cenas
        run: python scan.py
        env:
          OPERATORI: bite,lmt,tet # Tele2 bloķē GitHub serverus – to skenē lokāli (sk. README)
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}

      - name: Saglabā datus repozitorijā
        if: always()
        run: |
          git config user.name "cenu-bots"
          git config user.email "cenu-bots@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Cenas $(date -u +'%Y-%m-%d %H:%M')"
          git push
