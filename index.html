<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cenu skeneris</title>
<meta name="description" content="Bite, Tele2 un LMT telefonu, viedpulksteņu un austiņu cenas un to vēsture">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #6f6e69;
    --win-bg: #e3f3e3;
    --sale: #b4235a;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --ring: rgba(11,11,11,0.10);
    --hover: rgba(11,11,11,0.04);
    /* operatoru zīmolu krāsas (Bite zaļa, Tele2 zila, LMT oranža, Tet violeta),
       pārbaudītas ar krāsu redzes traucējumu simulāciju; nosaukums vienmēr blakus krāsai */
    --bite: #2fb36b;
    --tele2: #1d5bc4;
    --lmt: #f08a24;
    --tet: #8a3ffc;
    --down: #006300;      /* cena kritusies = labi */
    --up: #d03b3b;
    --accent: #1f63b8;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7;
      --muted: #9a9891; --grid: #2c2c2a; --axis: #383835; --win-bg: #17321a; --sale: #f0709a;
      --ring: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
      --bite: #239c5a; --tele2: #2e66d6; --lmt: #d97316; --tet: #b066ff; --down: #3ccf3c; --up: #e66767; --accent: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7;
    --muted: #9a9891; --grid: #2c2c2a; --axis: #383835; --win-bg: #17321a; --sale: #f0709a;
    --ring: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
    --bite: #239c5a; --tele2: #2e66d6; --lmt: #d97316; --tet: #b066ff; --down: #3ccf3c; --up: #e66767; --accent: #3987e5;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); margin: 0 0 20px; font-size: 14px; }
  .sub .warn { color: var(--up); }

  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .top .sub { margin: 0; }
  .legend-ops { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
  .legend-ops span { display: inline-flex; align-items: center; gap: 6px; }
  .stats { color: var(--ink-2); font-size: 13px; margin: -4px 0 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .stats .hero { font: inherit; font-size: 14px; color: var(--ink); background: var(--win-bg); border: 0; border-radius: 8px;
    padding: 6px 10px; cursor: pointer; text-align: left; }
  .stats .hero b { color: var(--down); }
  .stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .brands { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; margin-bottom: 4px; scrollbar-width: thin; }
  .brands button {
    font: inherit; font-size: 13px; white-space: nowrap; cursor: pointer; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--ring); border-radius: 999px; padding: 5px 12px; min-height: 36px;
  }
  .brands { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent);
            mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); padding-right: 40px; }
  @media (max-width: 640px) {
    .cats { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent);
            mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); padding-right: 32px; }
    .filters #q { order: -1; flex-basis: 100%; }
    .filters #views { flex: 1 1 100%; } .filters #views button { flex: 1; justify-content: center; }
  }
  .brands button .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .brands button[aria-pressed=true] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .brands button[aria-pressed=true] .n { color: inherit; opacity: .7; }
  .save { display: none; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 12px 14px; }
  .tile .k { color: var(--ink-2); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .tile .v { font-size: 26px; font-weight: 600; margin-top: 2px; }
  @media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, 1fr); } }

  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.bite { background: var(--bite); } .dot.tele2 { background: var(--tele2); } .dot.lmt { background: var(--lmt); } .dot.tet { background: var(--tet); }

  .cats { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--grid); overflow-x: auto; }
  .cats button {
    font: inherit; font-weight: 600; border: 0; background: none; color: var(--ink-2); cursor: pointer;
    padding: 8px 12px 10px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  .cats button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--ink); }
  .cats .n { color: var(--muted); font-weight: 400; margin-left: 4px; font-size: 13px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  .filters input[type=search], .filters select {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--ring); border-radius: 10px; padding: 8px 12px; min-height: 40px;
  }
  .filters input[type=search] { flex: 1 1 220px; }
  .seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .seg button {
    font: inherit; border: 0; background: none; color: var(--ink-2); padding: 8px 12px; min-height: 40px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .seg button[aria-pressed=true] { background: var(--hover); color: var(--ink); font-weight: 600; }
  .chips { display: inline-flex; gap: 8px; flex-wrap: wrap; }
  .chk { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); cursor: pointer; position: relative;
    background: var(--surface); border: 1px solid var(--ring); border-radius: 999px; padding: 0 14px; min-height: 40px; white-space: nowrap; }
  .chk input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .chk:has(input:checked) { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .chk:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; overflow: clip; }
  thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); box-shadow: inset 0 -1px 0 var(--grid); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; cursor: pointer; user-select: none; white-space: nowrap; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th[aria-sort=ascending]::after { content: " ↑"; } th[aria-sort=descending]::after { content: " ↓"; }
  tbody tr { cursor: pointer; }
  tbody tr[data-key] td:last-child { position: relative; padding-right: 30px; }
  tbody tr[data-key] td:last-child::after { content: "›"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 18px; }
  tbody tr[data-key]:hover td:last-child::after { color: var(--ink); }
  .more-row td { text-align: center; cursor: default; padding: 14px; }
  tr.sec td { cursor: default; font-weight: 700; font-size: 15px; padding: 18px 14px 8px; background: var(--page); border-bottom: 1px solid var(--grid); }
  tr.sec .cm { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 4px; }
  tr.sec .n { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 10px; }
  .code { font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .skus tr.cur td { background: var(--hover); }
  .skus tr.cur td.vk::before { content: "▸ "; color: var(--accent); }
  .more-row button { font: inherit; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--ring);
    border-radius: 10px; padding: 9px 16px; min-height: 40px; cursor: pointer; }
  .more-row button:hover { background: var(--hover); }
  .more-row .n { color: var(--muted); font-weight: 400; margin-left: 6px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  tbody tr:focus-visible { outline-offset: -2px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; line-height: 1; color: var(--sale);
    border: 1px solid currentColor; border-radius: 5px; padding: 2px 4px; margin-left: 4px; vertical-align: 1px; }
  .tag.used { color: var(--muted); }
  tbody tr:hover { background: var(--hover); }
  tbody tr:last-child td { border-bottom: 0; }
  .name { display: flex; align-items: center; gap: 10px; }
  .name .b { color: var(--muted); font-size: 12px; }
  .old { color: var(--muted); text-decoration: line-through; font-size: 12px; display: block; }
  .disc { color: var(--sale); font-weight: 600; white-space: nowrap; }   /* atlaide */
  .gap { color: var(--ink); font-weight: 700; white-space: nowrap; }     /* starpība starp operatoriem */
  .low { color: var(--ink-2); }
  .same { color: var(--muted); }
  td.cmp { white-space: nowrap; }
  td.cmp .pp { font-weight: 500; }
  td.cmp .from { color: var(--ink-2); font-size: 12px; margin-right: 3px; }
  td.cmp .mm { display: block; color: var(--muted); font-size: 12px; }
  td.cmp.win .pp { color: var(--down); font-weight: 700; background: var(--win-bg); border-radius: 6px; padding: 2px 6px; margin-right: -6px; }
  td.cmp .none { color: var(--muted); }
  th .dot { margin-right: 5px; vertical-align: 1px; }
  .variants { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--ink-2); }
  .variants li { display: flex; justify-content: space-between; gap: 8px; }
  .variants b { font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .variants .more { color: var(--muted); }
  .skus { width: 100%; border-collapse: collapse; margin: 4px 0 18px; font-size: 14px; }
  .skus th, .skus td { padding: 7px 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
  .skus th:first-child, .skus td:first-child { text-align: left; }
  .skus th { font-size: 12px; color: var(--muted); font-weight: 600; cursor: default; text-transform: none; letter-spacing: 0; }
  .skus td a { color: inherit; text-decoration: none; font-variant-numeric: tabular-nums; }
  .skus td a:hover { text-decoration: underline; }
  .skus td.win a { color: var(--down); font-weight: 700; background: var(--win-bg); border-radius: 6px; padding: 2px 6px; margin-right: -6px; }
  .skus td.na { color: var(--muted); }
  .skus .vk { font-weight: 600; }
  .skus-wrap { overflow-x: auto; }
  @media (max-width: 640px) {
    .skus { font-size: 12px; }
    .skus th, .skus td { padding: 7px 3px; }
    .skus th { font-size: 11px; }
    .skus th .dot { display: none; }
    .skus td.win a { margin-right: 0; padding: 2px 4px; }
  }
  .dlg-head + .chart-title { margin-top: 14px; }
  .note { color: var(--muted); font-size: 12px; margin: -12px 0 16px; }
  @media (max-width: 640px) {
    td.cmp { padding: 9px 5px; font-size: 13px; }
    td.cmp .mm { display: none; }
    td.cmp .from { display: block; margin: 0; }
    .compare th.num { padding: 9px 5px; font-size: 11px; }
    .compare td:first-child { padding-right: 4px; }
  }

  @media (max-width: 640px) {
    .compare thead { display: none; }
    .compare tbody tr { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 10px; padding: 12px; border-bottom: 1px solid var(--grid); }
    .compare tbody tr:last-child { border-bottom: 0; }
    .compare td { border: 0; padding: 0 !important; }
    .compare td:first-child { grid-column: 1 / -1; padding-bottom: 4px !important; }
    .compare td.cmp { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; font-size: 14px;
      background: var(--hover); border-radius: 8px; padding: 6px 8px !important; }
    .compare td.cmp::before { content: attr(data-op); font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center;
      padding-left: 13px; background: radial-gradient(circle 4.5px at 4.5px 50%, var(--opc) 98%, transparent) no-repeat; }
    .compare td.cmp[data-op="Bite"] { --opc: var(--bite); } .compare td.cmp[data-op="Tele2"] { --opc: var(--tele2); }
    .compare td.cmp[data-op="LMT"] { --opc: var(--lmt); } .compare td.cmp[data-op="Tet"] { --opc: var(--tet); }
    .compare td.cmp .from { display: inline; margin-left: auto; }
    .compare td.cmp .pp { margin-left: 2px; }
    .compare td.cmp.win { background: var(--win-bg); }
    .compare td.cmp.win .pp { background: none; padding: 0; margin: 0; }
    .compare tbody tr[data-key] td:last-child::after { content: none; }
    .compare .save { display: inline-block; margin-left: 8px; }
    .compare td.empty { grid-column: 1 / -1; }
    .compare tbody tr.sec { display: block; padding: 16px 12px 6px; background: var(--page); }
    .compare tbody tr.sec td { display: block; padding: 0 !important; background: none; border: 0; }
  }
  .empty { padding: 40px 16px; text-align: center; color: var(--ink-2); }
  @media (max-width: 640px) {
    th, td { padding: 9px 10px; }
    .hide-sm { display: none; }
  }

  dialog {
    border: 1px solid var(--ring); border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink);
    width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg { padding: 18px 18px 20px; }
  .dlg-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
  .dlg h2 { margin: 0; font-size: 20px; }
  .dlg .x { font: inherit; font-size: 22px; line-height: 1; border: 0; background: none; color: var(--ink-2); cursor: pointer; padding: 4px 8px; }
  .offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 14px 0 18px; }
  .offer { border: 1px solid var(--ring); border-radius: 12px; padding: 10px 12px; }
  .offer .op { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
  .offer .p { font-size: 22px; font-weight: 600; }
  .offer .m { color: var(--ink-2); font-size: 13px; }
  .offer a { color: var(--accent); font-size: 13px; }
  .best { font-size: 11px; font-weight: 600; color: var(--down); border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: auto; }
  .chart-title { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tip {
    position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring);
    border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
    white-space: nowrap; display: none; z-index: 2;
  }
  .tip .t { color: var(--muted); margin-bottom: 2px; }
  .tip .r { display: flex; align-items: center; gap: 6px; }
  .tip b { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 10px; }
  details { margin-top: 14px; font-size: 13px; }
  details summary { cursor: pointer; color: var(--ink-2); }
  details table td, details table th { padding: 6px 8px; font-size: 12px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Cenu skeneris</h1>
      <p class="sub" id="sub">Ielādē datus…</p>
    </div>
    <div class="legend-ops" id="legendOps"></div>
  </header>

  <div class="cats" role="tablist" aria-label="Kategorija" id="cats"></div>
  <p class="stats" id="stats"></p>

  <div class="filters">
    <div class="seg" role="group" aria-label="Skats" id="views">
      <button data-view="compare" aria-pressed="true">Salīdzinājums</button>
      <button data-view="list" aria-pressed="false">Saraksts</button>
    </div>
    <input type="search" id="q" placeholder="Meklēt, piem. iPhone 17, Galaxy Watch, AirPods…" aria-label="Meklēt">
    <div class="seg" role="group" aria-label="Operators" id="ops">
      <button data-op="" aria-pressed="true">Visi</button>
      <button data-op="bite" aria-pressed="false"><span class="dot bite"></span>Bite</button>
      <button data-op="tele2" aria-pressed="false"><span class="dot tele2"></span>Tele2</button>
      <button data-op="lmt" aria-pressed="false"><span class="dot lmt"></span>LMT</button>
      <button data-op="tet" aria-pressed="false"><span class="dot tet"></span>Tet</button>
    </div>
    <span class="chips">
      <label class="chk"><input type="checkbox" id="sale"> Akcijas</label>
      <label class="chk" id="multiWrap" hidden><input type="checkbox" id="multi" checked> 2+ operatoros</label>
    </span>
  </div>
  <div class="brands" id="brands" role="group" aria-label="Ražotājs"></div>
  <div class="brands sizes" id="sizes" role="group" aria-label="Diagonāle" hidden></div>

  <div class="card">
    <table id="tbl">
      <thead id="head"></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="foot">Dati: bite.lv, tele2.lv, lmt.lv un tet.lv, atjaunojas divreiz dienā. Zaļā cena ir lētākā; “no” – operatoram ir vairāki varianti; <span class="tag" style="margin:0">akcija</span> – cena ar atlaidi. Uzspied uz ierīces, lai redzētu precīzas variantu cenas un vēsturi.</p>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
const OPS = { bite: "Bite", tele2: "Tele2", lmt: "LMT", tet: "Tet" };
const CATS = { telefoni: "Telefoni", pulksteni: "Viedpulksteņi", austinas: "Austiņas", televizori: "Televizori", puteklsuceji: "Putekļsūcēji", kameras: "Kameras" };
// 1 459 € (bez ,00), 899,01 € – centi tikai, ja tie nav nulle; tūkstoši atdalīti ar šauru atstarpi
const fmtNum = (v, dec) => { const [i, f] = Math.abs(v).toFixed(dec).split(".");
  return (v < 0 ? "−" : "") + i.replace(/\B(?=(\d{3})+(?!\d))/g, "\u202f") + (f ? "," + f : ""); };
const eur = v => v == null ? "–" : fmtNum(v, Math.round(v * 100) % 100 === 0 ? 0 : 2) + "\u00a0€";
const eur0 = v => fmtNum(Math.round(v), 0) + "\u00a0€";
const PAGE = 50;
const fmtDate = d => d.toLocaleDateString("lv-LV", { day: "2-digit", month: "2-digit", year: "numeric" });
const fmtDT = d => d.toLocaleString("lv-LV", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = s => s === "" || s == null ? null : +s;

// Viens un tas pats modelis abos operatoros: bez atmiņas apjoma, 5G u.tml.
// Viena un tā pati ierīce visos operatoros: "Xiaomi Redmi Note 15 5G 256GB" (Tele2), "Redmi Note 15" (LMT),
// "Galaxy Watch9 LTE" (Bite), "Galaxy S26 12+256GB Black" (Tet) -> "redmi note 15", "galaxy watch 9", "galaxy s 26".
// Atmiņa, pulksteņa izmērs, krāsa, korpusa materiāls u.c. tiek ignorēti – tie ir viena produkta varianti.
const OPENED = /bojāts iepakojums|izpakot|mazlietot|atjaunot|refurb|demo|pre-?owned/i;  // nav salīdzināms ar jaunu preci
const COLOR_RE = new RegExp("\\b(" + ("black|white|silver|gold|golden|blue|green|red|pink|purple|gray|grey|graphite|midnight|" +
  "starlight|burgundy|slate|navy|cream|beige|orange|yellow|violet|lavender|mint|natural|desert|cosmic|sky|space|jet|rose|" +
  "onyx|obsidian|porcelain|sage|ivory|charcoal|coral|teal|lime|bronze|copper|champagne|olive|aqua|ice|icy|shadow|phantom|" +
  "cobalt|emerald|frost|stone|sand|denim|indigo|plum|lilac|peach|mocha|ocean|forest|arctic|polar|dark|light|deep|pale|" +
  "mist|misty|glacier|aurora|nebula|tidal|mystic|jade|marble|pearl|matte?|glossy|brown|melns|balts|zils|zals|sarkans|" +
  "roza|peleks|sudraba|zelta") + ")\\b", "g");
// vārdi, kas apzīmē citu modeli (Pixel 11 Pro XL ≠ Pixel 11 Pro) – tos prefiksu apvienošana neaiztiek
const MODEL_WORDS = new Set(("pro max ultra plus lite mini fe se classic edge fold flip neo active x s e air nc anc fit band " +
  "watch buds kids smart t r note prime power go open studio solo sport xl solar amoled inreach sapphire play wired eq " +
  "carbon dlc slim compact gaming").split(" "));
const baseKey = p => p.category + (OPENED.test(p.model || "") ? "|izpakota" : "") + "|" + (`${p.brand || ""} ${p.model || ""}`).toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g, "")         // fēnix -> fenix
  .split("|")[0]                                             // Bite: "AirPods 5 | Wireless Charging Case"
  .replace(/\(.*?\)/g, " ")                                  // iekavās – krāsas, kodi
  .replace(/\b\d+\s?[\/+]\s?\d+\s?(gb|tb)?\b/g, " ")        // 12+256GB, 8/256GB (pirms "+" apstrādes)
  .replace(/([a-z0-9])\+/g, "$1 plus")                      // Galaxy S26+ -> s26 plus
  .replace(/\bbojats iepakojums\b|\bizpakota ierice\b|\bwith .*$/g, " ")
  .replace(/\s-\s/g, " ")
  .replace(/\b\d+\s?[\/+]\s?\d+\s?(gb|tb)?\b/g, " ")        // 12+256GB, 8/256GB
  .replace(/\b\d+\s?(gb|tb)\b/g, " ")
  .replace(/\b\d+\s?mm\b/g, " ")                              // pulksteņa izmērs
  .replace(/\b(aluminium|aluminum|titanium|ceramics?|stainless steel|case|edition|silicone|band|loop|strap|leather|milanese|nylon|fabric|metal|steel)\b/g, " ")
  .replace(COLOR_RE, " ")
  .replace(/(\d)bt\b/g, "$1")                                 // tune 535bt -> tune 535
  .replace(/\b(5g|4g|lte|esim|bt|gps|cellular|dual sim|ds|wi-?fi|bluetooth|wireless|true)\b/g, " ")
  .replace(/([a-z])(\d)/g, "$1 $2")                          // watch9 -> watch 9
  .replace(/[^a-z0-9]+/g, " ").trim()
  .replace(/\b(\w+) \1\b/g, "$1")                             // "trust trust" -> "trust"
  .replace(/^(xiaomi )(redmi|poco)\b/, "$2");                // Xiaomi Redmi -> Redmi

// Prefiksu apvienošana: "samsung galaxy a 57 awesome icyblue" -> "samsung galaxy a 57", ja atlikušie vārdi
// nav cipari vai modeļa apzīmējumi (neparasti krāsu nosaukumi, ko nevar uzskaitīt).
function canonicalKeys(keys) {
  const ks = [...new Set(keys)].sort((a, b) => b.length - a.length), map = {};
  for (const k of ks) {
    let best = null;
    for (const g of ks) {
      if (g.length >= k.length || !k.startsWith(g + " ")) continue;
      if (k.slice(g.length + 1).split(" ").some(w => /\d/.test(w) || MODEL_WORDS.has(w))) continue;
      if (!best || g.length > best.length) best = g;
    }
    map[k] = best || k;
  }
  for (const k in map) { let v = map[k]; while (map[v] !== v) v = map[v]; map[k] = v; }
  return map;
}
const modelKey = baseKey;

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const [head, ...body] = rows;
  return body.filter(r => r.length === head.length).map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}

let ITEMS = [], HIST = {}, NOW = new Date(), META = null, VARIANTS = {},
  state = { limit: PAGE, view: "compare", cat: "telefoni", q: "", op: "", brand: "", diag: "", sale: false, multi: true, sort: "diff", dir: -1 };
const onSale = p => p.disc > 0 || (p.monthly_old && p.monthly_old > p.monthly);

async function load() {
  const [csv, latest, meta, variants] = await Promise.all([
    fetch("data/prices.csv", { cache: "no-store" }).then(r => r.ok ? r.text() : ""),
    fetch("data/latest.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}),
    fetch("data/meta.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch("data/variants.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  ]);
  META = meta; VARIANTS = variants || {};
  if (meta?.scanned_at) NOW = new Date(meta.scanned_at);

  for (const r of csv ? parseCSV(csv) : []) {
    const key = `${r.operator}:${r.id}`;
    (HIST[key] ||= []).push({ t: new Date(r.scanned_at), full: num(r.full), monthly: num(r.monthly) });
  }
  for (const h of Object.values(HIST)) h.sort((a, b) => a.t - b.t);

  ITEMS = Object.entries(latest).map(([key, p]) => ({ ...p, category: p.category || "telefoni", key })).map(p => {
    const key = p.key;
    const h = HIST[key] || [];
    const fulls = h.map(x => x.full).concat(p.full).filter(v => v != null);
    const min = fulls.length ? Math.min(...fulls) : null;
    const disc = p.full_old && p.full ? p.full_old - p.full : null;
    return { ...p, key, mk: baseKey(p), min, disc, name: `${p.brand || ""} ${p.model || ""}`.trim(), since: h[0]?.t };
  });
  const canon = canonicalKeys(ITEMS.map(p => p.mk));
  ITEMS.forEach(p => { p.mk = canon[p.mk]; });
  // ražotājs: viena rakstība ("SAMSUNG"/"Samsung"), Redmi/POCO -> Xiaomi, Huami -> Amazfit
  const spell = {};
  for (const p of ITEMS) { const k = brandKey(p.brand); (spell[k] ||= {})[p.brand] = (spell[k][p.brand] || 0) + 1; }
  ITEMS.forEach(p => {
    const k = brandKey(p.brand);
    p.brandN = BRAND_ALIAS[k] || Object.entries(spell[k] || {}).sort((a, b) => b[1] - a[1] || (/[a-z]/.test(b[0]) - /[a-z]/.test(a[0])))[0]?.[0] || p.brand || "Cits";
    p.search = searchNorm(`${p.brand} ${p.brandN} ${p.model}`);
  });
  prepareTV();

  render();
}

    save = best && { key: best.key, diff: best.diff, brand: best.brand, model: best.title || best.code, diffVk: best.diag ? best.diag + "″" : "" };
  } else {
    multi = buildGroups(inCat).filter(g => g.nOps > 1);
    const best = multi.reduce((m, g) => g.diff > (m?.diff || 0) ? g : m, null);
    save = best && { key: best.items[0].key, diff: best.diff, brand: best.brand, model: best.model, diffVk: best.diffVk || "" };

    `<span><b>${inCat.length}</b> preces · <b>${multi.length}</b> salīdzināmi modeļi · <b>${inCat.filter(onSale).length}</b> akcijās</span>`;
}

const LIST_COLS = [["name", "Ierīce", ""], ["full", "Cena", "num"], ["monthly", "Mēnesī", "num"],
  ["disc", "Atlaide", "num hide-sm"], ["min", "Bija lētāk", "num hide-sm"]];

function setHead(cols) {

    `<th data-k="${k}" class="${cls}" aria-sort="${state.sort === k ? (state.dir > 0 ? "ascending" : "descending") : "none"}">${label}</th>`).join("") + "</tr>";
}

const BRAND_ALIAS = { redmi: "Xiaomi", poco: "Xiaomi", xiaomi: "Xiaomi", huami: "Amazfit", amazfit: "Amazfit", beats: "Beats" };
const brandKey = b => (b || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
// meklēšana: "watch 9" atrod "Watch9", "fenix" atrod "fēnix"
const searchNorm = t => (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/([a-z])(\d)/g, "$1 $2").replace(/(\d)([a-z])/g, "$1 $2").replace(/[^a-z0-9]+/g, " ").trim();

function baseFilter(p, ignoreBrand) {
  const q = searchNorm(state.q);
  return (!state.cat || p.category === state.cat)
    && (ignoreBrand || !state.brand || p.brandN === state.brand)
    && (!q || q.split(" ").every(w => (" " + p.search + " ").includes(" " + w) ));
}

function renderBrands() {
  const pool = ITEMS.filter(p => baseFilter(p, true) && (state.view === "compare" || !state.op || p.operator === state.op));
  const n = {};
  for (const p of pool) n[p.brandN] = (n[p.brandN] || 0) + 1;
  const list = Object.entries(n).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  if (state.brand && !n[state.brand]) list.unshift([state.brand, 0]);

    list.map(([b, c]) => `<button data-brand="${esc(b)}" aria-pressed="${state.brand === b}">${esc(b)}<span class="n">${c}</span></button>`).join("");
}

/* ---------- Salīdzinājums: viena rinda katram modelim, kolonna katram operatoram ---------- */
function buildGroups(items) {
  const g = new Map();
  for (const p of items) {
    if (!g.has(p.mk)) g.set(p.mk, { mk: p.mk, items: [], byOp: {} });
    const grp = g.get(p.mk);
    grp.items.push(p);
    (grp.byOp[p.operator] ||= []).push(p);
  }
  for (const grp of g.values()) {
    for (const list of Object.values(grp.byOp)) list.sort((a, b) => (a.full ?? Infinity) - (b.full ?? Infinity));
    grp.best = Object.fromEntries(Object.entries(grp.byOp).map(([op, l]) => [op, l[0]]));
    const prices = Object.values(grp.best).map(p => p.full).filter(v => v != null);
    grp.nOps = Object.keys(grp.byOp).length;
    grp.min = prices.length ? Math.min(...prices) : null;
    grp.diff = null; grp.diffVk = null;
    // nosaukums: īsākais (parasti bez atmiņas/krāsas piebildēm)
    const rep = [...grp.items].sort((a, b) => a.name.length - b.name.length)[0];
    const multiVariant = grp.items.length > grp.nOps;
    const clean = m => multiVariant
      ? m.split("|")[0].replace(/\(.*?\)/g, "").replace(/\s*-?\s*\b\d+\s?mm\b/gi, "")
          .replace(/\b\d+\s?\/?\s?\d*\s?(GB|TB)\b/gi, "").replace(/\b(LTE|BT|eSIM|5G|4G)\b/gi, "")
          .replace(/\s+/g, " ").trim()
      : m;
    grp.brand = rep.brand; grp.model = clean(rep.model || ""); grp.name = `${rep.brand || ""} ${grp.model}`.trim(); grp.category = rep.category;
    if (grp.category === "televizori") {
      const set = new Set(grp.items), us = TV_UNITS.filter(u => set.has(u.item));
      const code = us.find(u => u.info?.series)?.info.series.replace(/^(QE|UE|MRE|TQ|GQ)/, "");
      grp.model = tvTitle(us) || grp.model; grp.brand = rep.brandN || rep.brand;
      if (code && !grp.model.toUpperCase().includes(code)) grp.model += ` · ${code}`;
      grp.name = `${grp.brand} ${grp.model}`;
    }
    for (const op of Object.keys(OPS)) grp[op] = grp.best[op]?.full ?? null;
    // starpība tikai starp vienādiem variantiem (piem. 256 GB pret 256 GB), nevis "no" cenām
    if (grp.nOps > 1) {
      const byVk = {};
      for (const r of skuRows(grp)) { const m = (byVk[r.vk] ||= {}); m[r.op] = Math.min(m[r.op] ?? Infinity, r.full); }
      for (const [vk, m] of Object.entries(byVk)) {
        const v = Object.values(m);
        if (v.length > 1 && Math.max(...v) - Math.min(...v) > (grp.diff ?? -1)) { grp.diff = Math.max(...v) - Math.min(...v); grp.diffVk = vk; }
      }
    }
  }
  return [...g.values()];
}

function renderCompare() {
  const ops = Object.keys(OPS).filter(op => ITEMS.some(p => p.operator === op));
  const cols = [["name", "Ierīce", ""], ...ops.map(op => [op, `<span class="dot ${op}"></span>${OPS[op]}`, "num"]),
    ["diff", "Starpība", "num hide-sm"]];
  if (!cols.some(c => c[0] === state.sort)) { state.sort = "diff"; state.dir = -1; }
  let groups = buildGroups(ITEMS.filter(p => baseFilter(p)))
    .filter(g => (!state.multi || g.nOps > 1) && (!state.sale || g.items.some(onSale)));
  const k = state.sort, d = state.dir;
  groups.sort((a, b) => k === "name" ? a.name.localeCompare(b.name, "lv") * d
    : ((a[k] ?? (d > 0 ? Infinity : -Infinity)) - (b[k] ?? (d > 0 ? Infinity : -Infinity))) * d || a.name.localeCompare(b.name, "lv"));
  setHead(cols);
  const total = groups.length;
  groups = groups.slice(0, state.limit);

  const cell = (g, op) => {
    const list = g.byOp[op];
    if (!list) return `<td class="num cmp" data-op="${OPS[op]}"><span class="none">–</span></td>`;
    const p = list[0], win = g.nOps > 1 && p.full === g.min && Object.values(g.best).some(x => x.full > g.min);
    return `<td class="num cmp${win ? " win" : ""}" data-op="${OPS[op]}" title="${esc(list.map(x => `${x.model}: ${eur(x.full)}`).join("\n"))}">
      ${list.length > 1 ? '<span class="from">no</span>' : ""}<span class="pp">${eur(p.full)}</span>
      <span class="mm">${p.monthly != null ? eur(p.monthly) + "/mēn." : ""}${onSale(p) ? '<span class="tag">akcija</span>' : ""}</span></td>`;
  };

  document.getElementById("rows").innerHTML = groups.length ? groups.map(g => `
    <tr data-key="${esc(g.items[0].key)}" tabindex="0">
      <td><div class="name"><div><div class="b">${esc(g.brand)}${state.cat ? "" : " · " + CATS[g.category]}</div>${esc(g.model)}${g.diff ? `<span class="save gap">līdz ${eur0(g.diff)} starpība</span>` : ""}</div></div></td>
      ${ops.map(op => cell(g, op)).join("")}
      <td class="num hide-sm">${g.diff ? `<span class="gap">${eur0(g.diff)}</span>${g.diffVk ? `<span class="mm" style="display:block;color:var(--muted);font-size:12px">${esc(g.diffVk)}</span>` : ""}` : ""}</td>
    </tr>`).join("") + moreRow(total, cols.length) : `<tr><td colspan="${cols.length}" class="empty">Nekas netika atrasts.</td></tr>`;
}

/* ---------- Televizori: sasaiste pēc ražotāja koda un diagonāles ---------- */
// Bite/Tele2/Tet raksta ražotāja kodu nosaukumā ("QE65QN80HAUXXH", "55PUS8001/12", "OLED65C61LA"),
// LMT – produkta lapā katram izmēram (variants.json). Kodā parasti ir diagonāle (65) un sērija (QN80H).
// Viens SKU = sērija + diagonāle. Ja koda nav (Tele2 Xiaomi) vai tajā nav izmēra (Xiaomi ELA…), sēriju nosaka pēc nosaukuma.
const TV_GENERIC = new Set(("4k 8k uhd hd fhd smart tv televizors televizori google android vision ai hdr hdr10 dolby atmos " +
  "ambilight evo the ar un inch collas cm qled qd led").split(" "));
const TV_SIZE_RE = /(\d{2,3})\s*(?:"|''|”|″|’’|-?\s?collas|\s?inch|\s?colla)/i;

function tvCode(model) {
  const toks = (model || "").replace(/[()]/g, " ").split(/\s+/).filter(Boolean);
  for (let i = toks.length - 1; i >= 0; i--) {
    const t = toks[i];
    if (!/^[A-Z0-9][A-Z0-9\-\/\.]{3,}$/.test(t) || t !== t.toUpperCase()) continue;
    if ((t.match(/\d/g) || []).length < 2 || !/[A-Z]/.test(t) || /^\d{4}$/.test(t) || /^\d+K$/.test(t)) continue;
    return t;
  }
  return null;
}

// -> { core: "QE65QN80H", size: 65, series: "QEQN80H" } vai null
function tvCodeInfo(brand, code) {
  if (!code) return null;
  let c = code.toUpperCase().split(/[\/.]/)[0].replace(/[^A-Z0-9]/g, "");
  const b = (brand || "").toLowerCase();
  if (b === "samsung") {
    // QE65QN80HAUXXH -> QE65QN80H; QE65LS03HWUXXH -> QE65LS03HW (cita versija); QE55S90HAEXXH -> QE55S90H
    const m = c.replace(/A?[A-Z]XXH$|XXH$/, "").match(/^([A-Z]{2,3})(\d{2,3})([A-Z]+\d+[A-Z0-9]*)$/);
    if (m) return { core: m[1] + m[2] + m[3], size: +m[2], series: m[1] + m[3] };
  }
  if (b === "lg") c = c.replace(/(\d)[A-Z]+$/, "$1");          // OLED65G61LW -> OLED65G61, 65QNED70B3A -> 65QNED70B3
  const m = c.match(/^([A-Z]{0,6})(\d{2,3})(?=[A-Z])/);         // pirmais skaitlis kodā = diagonāle
  if (m && +m[2] >= 19 && +m[2] <= 120) return { core: c, size: +m[2], series: c.slice(0, m[1].length) + c.slice(m[1].length + m[2].length) };
  return { core: c, size: null, series: null };
}

function tvNameSeries(brand, model) {
  const t = (model || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const year = (t.match(/\b(20\d\d)\b/) || [])[1] || "";
  const code = tvCode(model);
  const toks = t.replace(code ? code.toLowerCase() : "\u0000", " ").replace(/(\d{2,3})\s*("|''|”|″|’’|-?\s?collas|\s?inch)/g, " ")
    .replace(/[^a-z0-9]+/g, " ").split(" ").filter(w => w && !TV_GENERIC.has(w) && !/^20\d\d$/.test(w) && !/^\d{2,3}$/.test(w));
  return { tokens: [...new Set(toks)].sort().join(" "), year };
}

const tvDiagFrom = (...texts) => { for (const t of texts) { const m = (t || "").match(TV_SIZE_RE) || (t || "").match(/[-\/](\d{2,3})-collas/); if (m && +m[1] >= 19 && +m[1] <= 120) return +m[1]; } return null; };

// Visas konkrētās televizoru vienības (SKU līmenī) no precēm; LMT – no variants.json
function tvUnitsOf(p) {
  const vs = VARIANTS[p.key]?.variants;
  const mk = (code, diag, full, url, label, old) => {
    const info = tvCodeInfo(p.brandN || p.brand, code);
    return { item: p, op: p.operator, code, info, diag: info?.size || diag, full, full_old: old ?? null, url, label,
      monthly: vs ? null : p.monthly };
  };
  if (vs?.length) return vs.filter(v => v.full != null).map(v => mk(v.sku, tvDiagFrom(v.label, v.url), v.full, v.url, `${p.model} · ${v.sku || v.label}`, v.full_old));
  return [mk(tvCode(p.model), tvDiagFrom(p.model, p.url), p.full, p.url, p.model, p.full_old)];
}

// Piešķir sērijas atslēgu visām TV vienībām un precēm (p.mk), lai detaļu logs rādītu visus izmērus.
let TV_UNITS = [];
function prepareTV() {
  const tvItems = ITEMS.filter(p => p.category === "televizori" && !OPENED.test(p.model || ""));
  TV_UNITS = tvItems.flatMap(tvUnitsOf).filter(u => u.full != null);
  // 1) pēc koda
  for (const u of TV_UNITS) if (u.info?.series) u.series = `${brandKey(u.item.brandN)}|c|${u.info.series}`;
  const codeSeries = {};
  for (const u of TV_UNITS) if (u.series) (codeSeries[brandKey(u.item.brandN)] ||= new Set()).add(u.info.series);
  // 2) bez koda: vai nosaukumā ir vārds, kas viennozīmīgi atbilst kādai koda sērijai (piem. "M80H", "C61")?
  const byName = {};
  for (const u of TV_UNITS) {
    if (u.series) continue;
    const b = brandKey(u.item.brandN), ns = tvNameSeries(u.item.brandN, u.item.model);
    const hints = ns.tokens.split(" ").filter(w => w.length >= 3 && /\d/.test(w) && /[a-z]/.test(w)).map(w => w.toUpperCase());
    const cands = [...(codeSeries[b] || [])].filter(s => hints.some(h => s.endsWith(h) || s.replace(/^[A-Z]{2,4}(?=[A-Z])/, "") === h));
    if (cands.length === 1) { u.series = `${b}|c|${cands[0]}`; continue; }
    u.nameKey = `${b}|n|${ns.tokens}`; u.year = ns.year;
    (byName[u.nameKey] ||= []).push(u);
  }
  // 3) nosaukuma sērijas: gads tikai atdala, ja abiem ir gads (A Pro 2025 ≠ A Pro 2026)
  for (const [k, us] of Object.entries(byName)) {
    const years = {}; for (const u of us) if (u.year) years[u.year] = (years[u.year] || 0) + 1;
    const main = Object.entries(years).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
    for (const u of us) u.series = `${k}|${u.year || main}`;
  }
  for (const u of TV_UNITS) u.sku = `${u.series}|${u.diag || "?"}`;
  // preces sērija = tās (pirmās) vienības sērija
  for (const p of tvItems) { const u = TV_UNITS.find(x => x.item === p); if (u) p.mk = "televizori|" + u.series; }
}

const TV_TITLE_CLEAN = s => (s || "").replace(/^\s*\d{2,3}\s*("|''|”|″|’’)\s*\/?\s*/, "").replace(/\bSmart TV\b/gi, "")
  .replace(/\s+/g, " ").trim();
function tvTitle(units) {
  const named = units.map(u => {
    let t = TV_TITLE_CLEAN(u.item.model); if (u.code) t = t.replace(u.code, "");
    return { op: u.op, t: t.replace(/\s+/g, " ").trim() };
  }).filter(x => x.t && x.t.length > 2);
  const pick = named.find(x => x.op === "lmt") || named.filter(x => x.op !== "tele2").sort((a, b) => a.t.length - b.t.length)[0] || named[0];
  return pick?.t || "";
}

function tvRows(items) {
  const set = new Set(items);
  const g = new Map();
  for (const u of TV_UNITS) {
    if (!set.has(u.item)) continue;
    if (!g.has(u.sku)) g.set(u.sku, { sku: u.sku, units: [], byOp: {} });
    const r = g.get(u.sku); r.units.push(u);
    if (!r.byOp[u.op] || u.full < r.byOp[u.op].full) r.byOp[u.op] = u;
  }
  return [...g.values()].map(r => {
    const prices = Object.values(r.byOp).map(u => u.full);
    const u0 = r.units.find(u => u.info?.core) || r.units[0];
    r.diag = u0.diag; r.nOps = prices.length; r.min = Math.min(...prices);
    r.diff = prices.length > 1 ? Math.max(...prices) - r.min : null;
    r.brand = u0.item.brandN; r.code = u0.info?.core || ""; r.title = tvTitle(r.units);
    r.name = `${r.brand} ${r.title}`; r.key = u0.item.key;
    for (const op of Object.keys(OPS)) r[op] = r.byOp[op]?.full ?? null;
    return r;
  });
}

function renderSizes(rows) {
  const el = document.getElementById("sizes");
  if (state.cat !== "televizori" || state.view !== "compare") { el.hidden = true; return; }
  el.hidden = false;
  const n = {}; for (const r of rows) if (r.diag) n[r.diag] = (n[r.diag] || 0) + 1;
  const sizes = Object.keys(n).map(Number).sort((a, b) => a - b);
  el.innerHTML = `<button data-diag="" aria-pressed="${!state.diag}">Visi izmēri</button>` +
    sizes.map(s => `<button data-diag="${s}" aria-pressed="${state.diag == s}">${s}″<span class="n">${n[s]}</span></button>`).join("");
}

function renderTvCompare() {
  const ops = Object.keys(OPS).filter(op => ITEMS.some(p => p.operator === op));
  const cols = [["name", "Televizors", ""], ...ops.map(op => [op, `<span class="dot ${op}"></span>${OPS[op]}`, "num"]),
    ["diff", "Starpība", "num hide-sm"]];
  if (!cols.some(c => c[0] === state.sort)) { state.sort = "diff"; state.dir = -1; }
  let rows = tvRows(ITEMS.filter(p => baseFilter(p)))
    .filter(r => (!state.multi || r.nOps > 1) && (!state.sale || r.units.some(u => onSale(u.item))));
  renderSizes(rows);
  if (state.diag) rows = rows.filter(r => r.diag == state.diag);
  const k = state.sort, d = state.dir;
  const val = r => r[k] ?? (d > 0 ? Infinity : -Infinity);
  rows.sort((a, b) => (a.diag || 999) - (b.diag || 999)
    || (k === "name" ? a.name.localeCompare(b.name, "lv") * d : (val(a) - val(b)) * d)
    || a.name.localeCompare(b.name, "lv"));
  setHead(cols);
  const total = rows.length, perDiag = {};
  for (const r of rows) perDiag[r.diag] = (perDiag[r.diag] || 0) + 1;
  rows = rows.slice(0, state.limit);

  const cell = (r, op) => {
    const u = r.byOp[op];
    if (!u) return `<td class="num cmp" data-op="${OPS[op]}"><span class="none">–</span></td>`;
    const win = r.nOps > 1 && u.full === r.min && r.diff > 0;
    const m = u.monthly ?? u.item.monthly;
    return `<td class="num cmp${win ? " win" : ""}" data-op="${OPS[op]}" title="${esc(u.label)}"><span class="pp">${eur(u.full)}</span>
      <span class="mm">${m != null && u.op !== "lmt" ? eur(m) + "/mēn." : ""}${onSale(u.item) || (u.full_old && u.full_old > u.full) ? '<span class="tag">akcija</span>' : ""}</span></td>`;
  };
  let lastDiag = null, html = "";
  for (const r of rows) {
    if (r.diag !== lastDiag) {
      lastDiag = r.diag;
      html += `<tr class="sec"><td colspan="${cols.length}">${r.diag ? r.diag + "″" : "Izmērs nav norādīts"}${r.diag ? ` <span class="cm">${Math.round(r.diag * 2.54)} cm</span>` : ""}<span class="n">${perDiag[r.diag]} modeļi</span></td></tr>`;
    }
    html += `<tr data-key="${esc(r.key)}" data-vk="${r.diag ? r.diag + "″" : ""}" tabindex="0">
      <td><div class="name"><div><div class="b">${esc(r.brand)}${r.code ? ` · <span class="code">${esc(r.code)}</span>` : ""}</div>${esc(r.title || r.code)}${r.diff ? `<span class="save gap">līdz ${eur0(r.diff)} starpība</span>` : ""}</div></div></td>
      ${ops.map(op => cell(r, op)).join("")}
      <td class="num hide-sm">${r.diff ? `<span class="gap">${eur0(r.diff)}</span>` : ""}</td>
    </tr>`;
  }
  document.getElementById("rows").innerHTML = rows.length ? html + moreRow(total, cols.length)
    : `<tr><td colspan="${cols.length}" class="empty">Nekas netika atrasts.</td></tr>`;
}

/* ---------- Detaļas ---------- */
/* ---------- Precīzie varianti (SKU) ---------- */
// No nosaukuma/varianta apraksta izvelk to, kas ietekmē cenu: telefoniem atmiņu, pulksteņiem izmēru un LTE.
function variantKey(text, category) {
  const t = (" " + (text || "") + " ").toLowerCase().replace(/[-_]/g, " ");
  if (category === "telefoni") {
    const all = [...t.matchAll(/(\d+)\s?(gb|tb)\b/g)];
    // "8 256 gb" (LMT slug) / "12+256gb" -> 256; ja vienīgais skaitlis ir RAM (≤16 GB) un ir vēl viens – ņem lielāko
    let best = null;
    for (const m of all) { const gb = m[2] === "tb" ? +m[1] * 1024 : +m[1]; if (gb >= 32 && (!best || gb > best)) best = gb; }
    if (!best) { const pair = t.match(/\b(\d{1,2})\s(\d{2,4})\s?gb\b/); if (pair) best = +pair[2]; }
    return best ? (best >= 1024 ? best / 1024 + " TB" : best + " GB") : "";
  }
  if (category === "pulksteni") {
    const size = t.match(/\b(\d{2})\s?mm\b/), lte = /\b(lte|esim|cellular)\b/.test(t);
    return [size ? size[1] + " mm" : "", lte ? "LTE" : ""].filter(Boolean).join(" · ");
  }
  return "";
}
const vkOrder = k => { const n = parseFloat(k) || 0; return (/tb/i.test(k) ? n * 1024 : n) + (/LTE/.test(k) ? 0.5 : 0); };

// Visi zināmie konkrētie varianti grupai: Bite/LMT no variants.json, Tele2/Tet – katra prece pati par sevi.
function skuRows(g) {
  if (g.category === "televizori") {
    const set = new Set(g.items);
    return TV_UNITS.filter(u => set.has(u.item)).map(u => ({ op: u.op, vk: u.diag ? u.diag + "″" : "", full: u.full, url: u.url, label: u.label }));
  }
  const rows = [];
  for (const p of g.items) {
    const vs = VARIANTS[p.key]?.variants;
    if (vs?.length) for (const v of vs) {
      const lab = (v.label || "").replace(/^(\d{2})(?=\s*(,|$))/, "$1 mm");   // Bite pulksteņi: "40, Balts" -> "40 mm, Balts"
      rows.push({ op: p.operator, vk: variantKey(`${p.model} ${lab}`, g.category), full: v.full, url: v.url, label: v.label });
    }
    else rows.push({ op: p.operator, vk: variantKey(p.model, g.category), full: p.full, url: p.url, label: p.model });
  }
  return rows.filter(r => r.full != null);
}

function skuTable(g, ops, focus) {
  if (!VARIANT_CATS.has(g.category)) return "";
  const tv = g.category === "televizori";
  const rows = skuRows(g);
  const keys = [...new Set(rows.map(r => r.vk))].sort((a, b) => (a === "") - (b === "") || vkOrder(a) - vkOrder(b));
  if (keys.length < 2 && !(keys.length === 1 && keys[0])) return "";
  const body = keys.map(k => {
    const cells = ops.map(op => {
      const rs = rows.filter(r => r.op === op && r.vk === k).sort((a, b) => a.full - b.full);
      return rs[0] || null;
    });
    const prices = cells.filter(Boolean).map(c => c.full), min = Math.min(...prices), tie = min === Math.max(...prices);
    return `<tr${focus && k === focus ? ' class="cur"' : ""}><td class="vk">${esc(k || "Nav norādīts")}</td>${cells.map(c => !c ? '<td class="na">–</td>'
      : `<td class="${prices.length > 1 && !tie && c.full === min ? "win" : ""}"><a href="${esc(c.url)}" target="_blank" rel="noopener" title="${esc(c.label)}">${eur(c.full)}</a></td>`).join("")}</tr>`;
  }).join("");
  return `<p class="chart-title">Precīzs salīdzinājums pa ${tv ? "izmēriem" : "variantiem"}</p>
    <div class="skus-wrap"><table class="skus"><thead><tr><th>${tv ? "Izmērs" : "Variants"}</th>${ops.map(op => `<th><span class="dot ${op}"></span>${OPS[op]}</th>`).join("")}</tr></thead>
    <tbody>${body}</tbody></table></div>
    <p class="note">${tv ? "Katrā rindā – viens konkrēts modelis (ražotāja kods) šajā izmērā." : "Lētākā krāsa katram variantam."} Zaļā cena – lētākais operators. Uzspied cenu, lai atvērtu veikalā.</p>`;
}
const VARIANT_CATS = new Set(["telefoni", "pulksteni", "televizori"]);

function openDetail(key, focusVk) {
  const p = ITEMS.find(x => x.key === key);
  if (!p) return;
  const [g] = buildGroups(ITEMS.filter(x => x.mk === p.mk));
  const ops = Object.keys(OPS).filter(op => g.byOp[op]);

  // grafikam: katram operatoram – lētākā varianta cena katrā brīdī
  const series = ops.map(op => {
    const hs = g.byOp[op].map(x => ((HIST[x.key] || []).filter(e => e.full != null).length
      ? HIST[x.key].filter(e => e.full != null) : [{ t: NOW, full: x.full }]));
    const times = [...new Set(hs.flatMap(h => h.map(e => +e.t)))].sort((a, b) => a - b);
    const at = (h, t) => { let v = null; for (const e of h) { if (+e.t <= t) v = e.full; else break; } return v; };
    const pts = [];
    for (const t of times) {
      const vals = hs.map(h => at(h, t)).filter(v => v != null);
      const v = Math.min(...vals);
      if (!pts.length || pts[pts.length - 1].v !== v) pts.push({ t: new Date(t), v });
    }
    return { op, label: OPS[op], pts };
  });

  const sku = skuTable(g, ops, focusVk);
  const allPts = series.flatMap(s => s.pts), histStart = Math.min(...allPts.map(p => +p.t));
  const showChart = series.some(s => s.pts.length > 1);
  document.getElementById("dlgBody").innerHTML = `
    <div class="dlg-head">
      <div><div style="color:var(--muted);font-size:13px">${esc(g.brand)}</div><h2>${esc(g.model)}</h2></div>
      <button class="x" aria-label="Aizvērt" onclick="dlg.close()">×</button>
    </div>
    ${sku}
    <div class="offers">${ops.map(op => {
      const list = g.byOp[op], x = list[0];
      return `
      <div class="offer">
        <div class="op"><span class="dot ${op}"></span>${OPS[op]}${g.nOps > 1 && x.full === g.min && Object.values(g.best).some(y => y.full > g.min) ? '<span class="best">LĒTĀKAIS</span>' : ""}</div>
        <div class="p">${list.length > 1 ? '<span style="font-size:13px;font-weight:400;color:var(--muted)">no </span>' : ""}${eur(x.full)}</div>
        <div class="m">${eur(x.monthly)} / mēn.${x.full_old ? ` · bija ${eur(x.full_old)}` : ""}</div>
        ${(() => { const lo = Math.min(...list.map(v => v.min ?? Infinity)); return lo < x.full ? `<div class="m">Bija lētāk: ${eur(lo)}</div>` : ""; })()}
        ${list.length > 1 && !sku ? `<ul class="variants">${list.slice(0, 6).map(v => `<li><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.model)}</a><b>${eur(v.full)}</b></li>`).join("")}${list.length > 6 ? `<li class="more">… un vēl ${list.length - 6} varianti (krāsas, atmiņa)</li>` : ""}</ul>`
          : (x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">Atvērt veikalā ↗</a>` : "")}
      </div>`; }).join("")}
    </div>
    <p class="chart-title">Pilnā cena laika gaitā${g.items.length > ops.length ? " (lētākais variants)" : ""}</p>
    ${showChart ? `${series.length > 1 ? `<div class="legend">${series.map(s => `<span><span class="dot ${s.op}"></span>${esc(s.label)}</span>`).join("")}</div>` : ""}
    <div class="chart" id="chart"></div>` : `<p class="note" style="margin:0 0 14px">Cena nav mainījusies kopš ${esc(fmtDate(new Date(histStart)))}. Grafiks parādīsies, kad būs izmaiņas.</p>`}
    <details><summary>Cenu izmaiņas tabulā</summary>
      <table><thead><tr><th>Datums</th><th>Operators</th><th>Variants</th><th class="num">Cena</th></tr></thead><tbody>
      ${g.items.flatMap(x => (HIST[x.key] || []).map(e => ({ ...e, op: x.operator, model: x.model })))
        .sort((a, b) => b.t - a.t)
        .map(e => `<tr><td>${fmtDT(e.t)}</td><td>${OPS[e.op]}</td><td>${esc(e.model)}</td><td class="num">${eur(e.full)}</td></tr>`).join("")
        || `<tr><td colspan="4">Vēstures vēl nav.</td></tr>`}
      </tbody></table>
    </details>`;
  dlg.showModal();
  if (showChart) drawChart(document.getElementById("chart"), series);
}

/* ---------- Grafiks: pakāpju līnija (cena ir spēkā līdz nākamajai izmaiņai) ---------- */
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 50; max += 50; }
  const span = max - min, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + 1e-9; v += step) t.push(v);
  return t;
}

function drawChart(el, series) {
  const W = el.clientWidth || 600, H = 230, M = { t: 12, r: 96, b: 26, l: 52 };
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const all = series.flatMap(s => s.pts);
  let t0 = Math.min(...all.map(p => +p.t)), t1 = +NOW;
  if (t1 - t0 < 864e5) t0 = t1 - 864e5;               // vismaz 1 diena
  const yt = niceTicks(Math.min(...all.map(p => p.v)), Math.max(...all.map(p => p.v)));
  const y0 = yt[0], y1 = yt[yt.length - 1];
  const X = t => M.l + (t - t0) / (t1 - t0) * iw;
  const Y = v => M.t + ih - (v - y0) / (y1 - y0) * ih;
  const color = op => `var(--${op})`;

  const at = (s, t) => { let v = null; for (const p of s.pts) { if (+p.t <= t) v = p.v; else break; } return v; };

  // x ass ķeksīši: ~4 datumi
  const short = W < 520, nx = short ? (t1 - t0 < 3 * 864e5 ? 1 : 2) : 3;
  const xt = []; for (let i = 0; i <= nx; i++) xt.push(t0 + (t1 - t0) * i / nx);
  const xLabel = t => (t1 - t0 < 3 * 864e5) ? fmtDT(new Date(t))
    : short ? new Date(t).toLocaleDateString("lv-LV", { day: "2-digit", month: "2-digit" }) : fmtDate(new Date(t));

  const paths = series.map(s => {
    let d = "";
    s.pts.forEach((p, i) => {
      const x = X(+p.t), y = Y(p.v);
      d += i === 0 ? `M${x},${y}` : `H${x}V${y}`;
    });
    d += `H${X(t1)}`;
    return d;
  });

  // tiešie marķējumi līnijas galā; ja pārklājas, pabīda
  const ends = series.map((s, i) => ({ i, y: Y(s.pts[s.pts.length - 1].v), v: s.pts[s.pts.length - 1].v }))
    .sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;

  el.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Cenu vēstures grafiks">
    ${yt.map(v => `<line x1="${M.l}" x2="${W - M.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/>
      <text x="${M.l - 8}" y="${Y(v) + 4}" text-anchor="end">${eur0(v)}</text>`).join("")}
    <line x1="${M.l}" x2="${W - M.r}" y1="${M.t + ih}" y2="${M.t + ih}" stroke="var(--axis)"/>
    ${xt.map((t, i) => `<text x="${X(t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === nx ? "end" : "middle"}">${xLabel(t)}</text>`).join("")}
    ${paths.map((d, i) => `<path d="${d}" fill="none" stroke="${color(series[i].op)}" stroke-width="2" stroke-linejoin="round"/>`).join("")}
    ${series.map(s => s.pts.map(p => `<circle cx="${X(+p.t)}" cy="${Y(p.v)}" r="4" fill="${color(s.op)}" stroke="var(--surface)" stroke-width="2"/>`).join("")).join("")}
    ${ends.map(e => `<text x="${W - M.r + 6}" y="${e.y + 4}" style="fill:var(--ink-2)">${esc(series[e.i].label)} ${eur0(e.v)}</text>`).join("")}
    <line id="xh" y1="${M.t}" y2="${M.t + ih}" stroke="var(--axis)" style="display:none"/>
    <g id="hdots"></g>
    <rect x="${M.l}" y="${M.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/>
  </svg><div class="tip" id="tip"></div>`;

  const svg = el.querySelector("svg"), tip = el.querySelector("#tip"), xh = el.querySelector("#xh"), hd = el.querySelector("#hdots");
  const move = ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width;
    const t = t0 + Math.max(0, Math.min(1, (sx - M.l) / iw)) * (t1 - t0), x = X(t);
    xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.style.display = "";
    const vals = series.map(s => ({ s, v: at(s, t) }));
    hd.innerHTML = vals.filter(o => o.v != null).map(o => `<circle cx="${x}" cy="${Y(o.v)}" r="5" fill="${color(o.s.op)}" stroke="var(--surface)" stroke-width="2"/>`).join("");
    tip.innerHTML = `<div class="t">${fmtDT(new Date(t))}</div>` + vals.map(o =>
      `<div class="r"><span class="dot ${o.s.op}"></span>${esc(o.s.label)}<b>${o.v == null ? "–" : eur(o.v)}</b></div>`).join("");
    tip.style.display = "block";
    const px = x * r.width / W, tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, px + 12), r.width - tw) + "px";
    tip.style.top = "6px";
  };
  const leave = () => { tip.style.display = "none"; xh.style.display = "none"; hd.innerHTML = ""; };
  const hit = el.querySelector("#hit");
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", leave);
}

/* ---------- Notikumi ---------- */
const dlg = document.getElementById("dlg");
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
document.getElementById("cats").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.cat = b.dataset.cat; state.brand = ""; state.diag = ""; render();
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("sale").addEventListener("change", e => { state.sale = e.target.checked; render(); });
document.getElementById("ops").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.op = b.dataset.op;
  document.querySelectorAll("#ops button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
document.getElementById("head").addEventListener("click", e => {
  const th = e.target.closest("th[data-k]"); if (!th) return;
  const k = th.dataset.k;
  state.dir = state.sort === k ? -state.dir : (k === "disc" || k === "diff" ? -1 : 1);
  state.sort = k; render();
});
document.getElementById("views").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.view = b.dataset.view; render();
});
document.getElementById("brands").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.brand = state.brand === b.dataset.brand ? "" : b.dataset.brand; render();
});
document.getElementById("sizes").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.diag = state.diag === b.dataset.diag ? "" : b.dataset.diag; render();
});
document.getElementById("multi").addEventListener("change", e => { state.multi = e.target.checked; render(); });
const rows = document.getElementById("rows");
rows.addEventListener("click", e => {
  if (e.target.closest("[data-more]")) { state.limit += PAGE; render(); return; }
  const tr = e.target.closest("tr[data-key]"); if (tr) openDetail(tr.dataset.key, tr.dataset.vk);
});
document.getElementById("stats").addEventListener("click", e => { const b = e.target.closest(".hero"); if (b) openDetail(b.dataset.key, b.dataset.vk); });
rows.addEventListener("keydown", e => { if (e.key === "Enter") { const tr = e.target.closest("tr[data-key]"); if (tr) openDetail(tr.dataset.key); } });

load().catch(err => { document.getElementById("sub").textContent = "Neizdevās ielādēt datus: " + err.message; });
</script>
