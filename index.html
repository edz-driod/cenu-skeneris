/* ---------- Izmaiņas: kas mainījās pa operatoriem ---------- */
const PERIODS = [[1, "Pēdējā diena"], [7, "7 dienas"], [30, "30 dienas"]];
const dayStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return +x; };
const fmtDay = d => new Date(d).toLocaleDateString("lv-LV", { day: "2-digit", month: "2-digit" }).replace(/\.?$/, ".");
const periodFrom = () => state.period === 1 ? dayStart(NOW) : +NOW - state.period * 864e5;

function changeLog() {
  const from = periodFrom(), inCat = c => !state.cat || c === state.cat, seen = new Set(), ev = [];
  const add = (sig, e) => { if (!seen.has(sig)) { seen.add(sig); ev.push(e); } };
  for (const p of ITEMS) {
    if (!inCat(p.category) || isUsed(p)) continue;
    const vk = variantKey(p.model, p.category), first = CATFIRST[`${p.operator}/${p.category}`];
    // jauns: parādījās pēc tam, kad šī operatora kategorija jau tika skenēta
    if (p.since && +p.since >= from && first && +p.since - first > 36e5) {
      add(`n|${p.operator}|${p.mk}|${vk}`, { op: p.operator, kind: "new", key: p.key, vk, name: p.name, cat: p.category, b: p.full, t: p.since });
      continue;
    }
    if (p.full == null) continue;
    // bāze: cena perioda sākumā; ja vēsture sākas vēlāk – pirmā zināmā cena
    const h = (HIST[p.key] || []).filter(e => e.full != null);
    if (!h.length) continue;
    let before = h[0].full, t = null;
    for (const e of h) { if (+e.t < from) before = e.full; else if (e.full !== before) t = e.t; }
    if (before === p.full) continue;
    add(`c|${p.operator}|${p.mk}|${vk}|${before}|${p.full}`,
      { op: p.operator, kind: p.full < before ? "down" : "up", key: p.key, vk, name: p.name, cat: p.category, a: before, b: p.full, t: t || NOW });
  }
  const live = new Set(ITEMS.map(p => p.key));
  for (const [key, g] of Object.entries(META?.gone || {})) {
    const t = new Date(g.removed_at);
    if (live.has(key) || !inCat(g.category) || +t < from || !OPS[g.operator]) continue;
    const name = `${g.brand || ""} ${g.model || ""}`.trim();
    add(`g|${g.operator}|${name}`, { op: g.operator, kind: "gone", name, cat: g.category, a: g.full, t });
  }
  return ev;
}

const KIND_ORDER = { down: 0, new: 1, up: 2, gone: 3 };
// nosaukums bez atmiņas un krāsas, ja variants jau parādīts atsevišķi
const COLOR_I = new RegExp(COLOR_RE.source, "gi");
const evName = e => !e.vk ? e.name : e.name.replace(/\(.*?\)/g, " ").replace(/\b\d+\s?[\/+]\s?\d+\s?(GB|TB)\b/gi, " ")
  .replace(/\b\d+\s?(GB|TB)\b/gi, " ").replace(/\b\d{2}\s?mm\b/gi, " ").replace(COLOR_I, " ").replace(/\s+/g, " ").trim() || e.name;
function evRow(e) {
  const nm = `${esc(evName(e))}${e.vk ? ` <span class="evk">${esc(e.vk)}</span>` : ""}`;
  const sub = `<span class="es">${state.cat ? "" : esc(CATS[e.cat] || "") + " · "}${fmtDay(e.t)}</span>`;
  if (e.kind === "gone")
    return `<li><div class="ev gone"><span class="en">${nm}</span><span class="ep">${e.a != null ? eur(e.a) : ""}</span>${sub}<span class="ed"><span class="kind gone">pazudis</span></span></div></li>`;
  const ed = e.kind === "new" ? `<span class="kind new">jauns</span>`
    : `<span class="${e.kind === "down" ? "dn" : "upc"}">${deltaTxt(e.b - e.a)}</span> <span class="was">no ${eur(e.a)}</span>`;
  const label = e.kind === "new" ? "jauns modelis" : e.kind === "down" ? `lētāk, bija ${eur(e.a)}` : `dārgāk, bija ${eur(e.a)}`;
  return `<li><button type="button" class="ev" data-key="${esc(e.key)}" data-vk="${esc(e.vk)}" aria-label="${esc(OPS[e.op])}: ${esc(e.name)} ${esc(e.vk)}, ${eur(e.b)}, ${label}">
    <span class="en">${nm}</span><span class="ep">${eur(e.b)}</span>${sub}<span class="ed">${ed}</span></button></li>`;
}

function renderChanges() {
  const el = document.getElementById("chgcard");
  if (!ITEMS.length) { el.hidden = true; return; }
  el.hidden = false;
  const ev = changeLog(), from = periodFrom();
  const ops = opsAll().sort((a, b) => (b === state.me) - (a === state.me));
  const histStart = Math.min(...Object.values(CATFIRST).map(Number));
  const span = state.period === 1 ? `pēdējās skenēšanas dienā, ${fmtDay(NOW)}` : `pēdējās ${state.period} dienās`;
  const short = isFinite(histStart) && histStart > from ? ` (vēsture sākas ${fmtDay(histStart)})` : "";
  const lim = narrow() ? 3 : 5;
  const cols = ops.map(op => {
    const list = ev.filter(e => e.op === op).sort((a, b) => KIND_ORDER[a.kind] - KIND_ORDER[b.kind]
      || Math.abs((b.b ?? 0) - (b.a ?? 0)) - Math.abs((a.b ?? 0) - (a.a ?? 0)) || a.name.localeCompare(b.name, "lv"));
    const n = k => list.filter(e => e.kind === k).length;
    const sum = [[n("down"), "lētāk"], [n("up"), "dārgāk"], [n("new"), n("new") === 1 ? "jauns" : "jauni"], [n("gone"), n("gone") === 1 ? "pazudis" : "pazuduši"]]
      .filter(([c]) => c).map(([c, w]) => `<span><b>${c}</b> ${w}</span>`).join("");
    const shown = state.open[op] ? list : list.slice(0, lim);
    return `<div class="opcol${op === state.me ? " me" : ""}">
      <h3 class="oph"><span class="dot ${op}"></span>${OPS[op]}${op === state.me ? '<span class="mine">mans</span>' : ""}</h3>
      ${list.length ? `<p class="opsum">${sum}</p><ul class="evs">${shown.map(evRow).join("")}</ul>
        ${list.length > lim ? `<button type="button" class="evmore" data-op="${op}" aria-expanded="${!!state.open[op]}">${state.open[op] ? "Rādīt mazāk" : `Rādīt visas ${list.length}`}</button>` : ""}`
        : `<p class="quiet">Bez izmaiņām</p>`}
    </div>`;
  }).join("");
  el.innerHTML = `<div class="card-head">
      <div class="ttl"><h1 id="chgTitle">Cenu izmaiņas</h1><p>${state.cat ? CATS[state.cat] : "Visas kategorijas"} · ${span}${short} · ${ev.length} ${ev.length === 1 ? "izmaiņa" : "izmaiņas"}</p></div>
      <div class="seg" id="periods" role="group" aria-label="Periods">${PERIODS.map(([d, l]) =>
        `<button type="button" data-period="${d}" aria-pressed="${state.period === d}">${l}</button>`).join("")}</div>
    </div>
    <div class="ops4">${cols}</div>`;
}

function renderBrands() {
  const pool = ITEMS.filter(p => baseFilter(p, true) && (!(state.onlyMine && state.me) || p.operator === state.me));
  const n = {};
  for (const p of pool) n[p.brandN] = (n[p.brandN] || 0) + 1;
  const list = Object.entries(n).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  if (state.brand && !n[state.brand]) list.unshift([state.brand, 0]);
  document.getElementById("brands").innerHTML =
    `<button type="button" class="chip" data-brand="" aria-pressed="${!state.brand}">Visi</button>` +
    list.map(([b, c]) => `<button type="button" class="chip" data-brand="${esc(b)}" aria-pressed="${state.brand === b}">${esc(b)} <span class="n">${c}</span></button>`).join("");
}

let lastSig = "";
function render() {
  const sig = JSON.stringify([state.view, state.cat, state.q, state.me, state.onlyMine, state.brand, state.diag, state.sale, state.multi, state.sort]);
  if (sig !== lastSig) { state.limit = PAGE; lastSig = sig; }
  renderHeader();
  document.getElementById("shop").hidden = state.page === "an";
  document.getElementById("an").hidden = state.page !== "an";
  writeHash();
  if (state.page === "an") { renderAnalysis(); return; }
  renderBrands();
  document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === state.view));
  document.getElementById("multiWrap").hidden = state.view === "list";
  document.getElementById("chgWrap").hidden = state.view === "list";
  const sm = document.getElementById("sortMe");
  sm.hidden = sm.disabled = !state.me; sm.textContent = state.me ? `kur ${OPS[state.me]} dārgāks` : "";
  document.getElementById("sort").value = state.sort === "me" && !state.me ? "diff" : state.sort;
  document.getElementById("onlyWrap").hidden = !state.me;
  document.getElementById("onlyLbl").textContent = state.me ? `Tikai ${OPS[state.me]} modeļi` : "";
  document.getElementById("onlyMine").checked = state.onlyMine;
  document.getElementById("chg").checked = state.changes;
  document.getElementById("multi").checked = state.multi;
  document.getElementById("sale").checked = state.sale;
  const qi = document.getElementById("q"); if (qi.value !== state.q) qi.value = state.q;
  state.view === "list" ? renderList() : renderRows();
}

/* ---------- Detaļu logs ---------- */
let DLG = null;
function openDetail(key, focusVk, { fromUrl = false } = {}) {
  const p = ITEMS.find(x => x.key === key);
  if (!p) {
    if (fromUrl) {
      state.dlg = state.dlgVk = ""; writeHash();
      const n = document.getElementById("notice");
      n.textContent = "Saitē norādītais modelis šobrīd nav pieejams nevienā veikalā. Zemāk – visas pašreizējās cenas.";
      n.hidden = false;
    }
    return;
  }
  state.dlg = key; state.dlgVk = focusVk || "";
  if (!fromUrl) { writeHash(true); dlgPushed = true; }
  const [g] = buildGroups(ITEMS.filter(x => x.mk === p.mk));
  const ops = Object.keys(OPS).filter(op => g.byOp[op]);
  const tv = g.category === "televizori";

  // kāpnes katram variantam / izmēram
  const rows = VARIANT_CATS.has(g.category) ? skuRows(g) : [];
  const byVk = {};
  for (const r of rows) { const m = (byVk[r.vk] ||= {}); if (!m[r.op] || r.full < m[r.op].v) m[r.op] = { v: r.full, url: r.url }; }
  let keys = Object.keys(byVk).sort((a, b) => (a === "") - (b === "") || vkOrder(a) - vkOrder(b));
  if (keys.length === 1 && !keys[0]) keys = [];
  const groups = keys.length ? keys.map(k => [k, byVk[k]])
    : [["", Object.fromEntries(ops.map(op => { const b = g.best[op]; return [op, { v: b.full, url: b.url, from: g.byOp[op].length > 1 }]; }))]];
  const vrows = groups.map(([k, prices]) => {
    const vals = Object.values(prices).map(x => x.v), min = Math.min(...vals), tie = min === Math.max(...vals);
    const win = Object.keys(prices).filter(op => prices[op].v === min);
    const n = Object.keys(prices).length;
    const tag = n > 1 && !tie
      ? `<a class="ptag" href="${esc(prices[win[0]].url)}" target="_blank" rel="noopener"><span class="at">Lētāk ${win.map(op => OPS[op]).join(", ")} ↗</span><span class="v">${eur(min)}</span></a>`
      : `<a class="ptag solo" href="${esc(prices[win[0]].url)}" target="_blank" rel="noopener"><span class="at">${n > 1 ? "Visur vienādi" : "Tikai " + OPS[win[0]]} ↗</span><span class="v">${eur(min)}</span></a>`;
    return `<div class="vrow${focusVk && k === focusVk ? " cur" : ""}"><div class="vk${k.length > 4 ? " small" : ""}">${esc(k || (keys.length ? "Cits" : "Cena"))}</div>
      ${ladder(prices, { winners: n > 1 && !tie ? win : [] })}<div class="lt2">${tag}</div></div>`;
  }).join("");

  DLG = { g, ops, period: 30 };
  document.getElementById("dlgBody").innerHTML = `
    <div class="dlg-head">
      <div><div class="b">${esc(g.brand)} · ${CATS[g.category] || ""}</div><h2 id="dlgTitle">${esc(g.model)}</h2></div>
      <button type="button" class="x" aria-label="Aizvērt" data-close><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <section><h3>${keys.length ? (tv ? "Cenas pa izmēriem" : "Cenas pa variantiem") : "Cenas veikalos"}</h3>
      <p class="quiet" style="margin:4px 0 10px">${keys.length ? (tv ? "Katrā rindā viens konkrēts modelis (ražotāja kods) šajā izmērā." : "Lētākā krāsa katram variantam.") + " " : ""}Dzeltenā zīme ved uz lētāko veikalu.</p>
      <div class="vrows">${vrows}</div></section>
    <div class="shops">${ops.map(op => { const b = g.best[op];
      return `<a class="shop" href="${esc(b.url)}" target="_blank" rel="noopener"><span class="dot ${op}"></span>${OPS[op]} <b>${g.byOp[op].length > 1 ? "no " : ""}${eur(b.full)}</b> ↗</a>`; }).join("")}</div>
    <section>
      <div class="hist-head"><h3>Cena laika gaitā${g.items.length > ops.length ? " (lētākais variants)" : ""}</h3>
        <div class="seg" id="period" role="group" aria-label="Periods">${[[7, "7 d."], [30, "30 d."], [90, "90 d."], [0, "Visi"]].map(([d, l]) =>
          `<button type="button" data-p="${d}" aria-pressed="${d === 30}">${l}</button>`).join("")}</div></div>
      <div id="histBox" style="margin-top:12px"></div>
    </section>`;
  if (!dlg.open) dlg.showModal();
  drawHistory();
}

function drawHistory() {
  const { g, ops, period } = DLG;
  const from = period ? +NOW - period * 864e5 : -Infinity;
  const at = (h, t) => { let v = null; for (const e of h) { if (+e.t <= t) v = e.full; else break; } return v; };
  const series = ops.map(op => {
    const hs = g.byOp[op].map(x => ((HIST[x.key] || []).filter(e => e.full != null).length
      ? HIST[x.key].filter(e => e.full != null) : [{ t: NOW, full: x.full }]));
    const times = [...new Set(hs.flatMap(h => h.map(e => +e.t)))].sort((a, b) => a - b);
    let pts = [];
    for (const t of times) {
      const vals = hs.map(h => at(h, t)).filter(v => v != null);
      const v = Math.min(...vals);
      if (!pts.length || pts[pts.length - 1].v !== v) pts.push({ t: new Date(t), v });
    }
    if (period) {   // apgriež: cena perioda sākumā + izmaiņas pēc tam
      const before = pts.filter(p => +p.t <= from).pop();
      pts = (before ? [{ t: new Date(from), v: before.v }] : []).concat(pts.filter(p => +p.t > from));
      if (!pts.length) pts = [{ t: new Date(from), v: g.best[op].full }];
    }
    return { op, label: OPS[op], pts };
  });
  // izmaiņu saraksts
  const ev = [];
  for (const x of g.items) {
    const h = (HIST[x.key] || []).filter(e => e.full != null);
    for (let i = 1; i < h.length; i++) if (h[i].full !== h[i - 1].full && +h[i].t > from)
      ev.push({ t: h[i].t, op: x.operator, a: h[i - 1].full, b: h[i].full, vk: variantKey(x.model, g.category) });
  }
  ev.sort((a, b) => b.t - a.t);
  const moved = series.some(s => s.pts.length > 1 && new Set(s.pts.map(p => p.v)).size > 1);
  const box = document.getElementById("histBox");
  box.innerHTML = `${moved ? `<div class="chart" id="chart"></div>` : `<p class="quiet">Šajā periodā cenas nav mainījušās.</p>`}
    ${ev.length ? `<ul class="events" style="margin-top:14px">${ev.slice(0, 10).map(e => `<li><span class="dt">${fmtDate(e.t)}</span><span class="dot ${e.op}"></span>${OPS[e.op]}${e.vk ? " " + esc(e.vk) : ""}
      <span class="num">${eur(e.a)} → <b class="${e.b < e.a ? "dn" : "upc"}">${eur(e.b)}</b></span></li>`).join("")}</ul>` : ""}`;
  if (moved) drawChart(document.getElementById("chart"), series);
}

/* ---------- Stāvoklis adresē: kategorija, filtri, atvērtais modelis (saites no Telegram) ---------- */
const DEF = { cat: "telefoni", view: "ladder", sort: "diff", period: 7 };
let dlgPushed = false;
function writeHash(push = false) {
  const p = new URLSearchParams();
  if (state.page === "an") { p.set("analize", ""); if (state.acat) p.set("ak", state.acat); }
  else {
    if (state.cat !== DEF.cat) p.set("k", state.cat || "visi");
    if (state.q) p.set("q", state.q);
    if (state.brand) p.set("r", state.brand);
    if (state.diag) p.set("d", state.diag);
    if (state.view !== DEF.view) p.set("v", state.view);
    if (state.sort !== DEF.sort) p.set("s", state.sort);
    if (!state.multi) p.set("m", "0");
    if (!state.changes) p.set("c", "0");
    if (state.sale) p.set("a", "1");
    if (state.onlyMine) p.set("t", "1");
    if (state.period !== DEF.period) p.set("p", state.period);
  }
  if (state.dlg) { p.set("dlg", state.dlg); if (state.dlgVk) p.set("vk", state.dlgVk); }
  const h = p.toString().replace(/=(?=&|$)/g, "");
  const url = location.pathname + location.search + (h ? "#" + h : "");
  if (url !== location.pathname + location.search + location.hash) history[push ? "pushState" : "replaceState"](null, "", url);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1)), k = p.get("k");
  state.page = p.has("analize") ? "an" : "";
  state.acat = p.get("ak") || "";
  state.cat = k == null ? DEF.cat : k === "visi" ? "" : k;
  state.q = p.get("q") || ""; state.brand = p.get("r") || ""; state.diag = p.get("d") || "";
  state.view = ["ladder", "table", "list"].includes(p.get("v")) ? p.get("v") : DEF.view;
  state.sort = p.get("s") || DEF.sort;
  state.multi = p.get("m") !== "0"; state.changes = p.get("c") !== "0";
  state.sale = p.get("a") === "1"; state.onlyMine = p.get("t") === "1";
  state.period = [1, 7, 30].includes(+p.get("p")) ? +p.get("p") : DEF.period;
  state.dlg = p.get("dlg") || ""; state.dlgVk = p.get("vk") || "";
}
window.addEventListener("popstate", () => {
  readHash(); dlgPushed = false;
  if (!ITEMS.length) return;
  render();
  if (state.dlg) openDetail(state.dlg, state.dlgVk, { fromUrl: true });
  else if (dlg.open) dlg.close();
});

/* ---------- Notikumi ---------- */
const dlg = document.getElementById("dlg");
dlg.addEventListener("close", () => {
  if (!state.dlg) return;
  state.dlg = state.dlgVk = "";
  if (dlgPushed) { dlgPushed = false; history.back(); } else writeHash();
});
document.getElementById("chgcard").addEventListener("click", e => {
  const per = e.target.closest("[data-period]");
  if (per) { state.period = +per.dataset.period; renderChanges(); writeHash(); return; }
  const more = e.target.closest(".evmore");
  if (more) { state.open[more.dataset.op] = !state.open[more.dataset.op]; renderChanges(); return; }
  const ev = e.target.closest("[data-key]");
  if (ev) openDetail(ev.dataset.key, ev.dataset.vk);
});
dlg.addEventListener("click", e => {
  if (e.target === dlg || e.target.closest("[data-close]")) { dlg.close(); return; }
  const b = e.target.closest("#period button");
  if (b) { DLG.period = +b.dataset.p; document.querySelectorAll("#period button").forEach(x => x.setAttribute("aria-pressed", x === b)); drawHistory(); }
});
document.getElementById("cats").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.page) { state.page = "an"; render(); window.scrollTo(0, 0); return; }
  state.page = "";
  state.cat = b.dataset.cat; state.brand = ""; state.diag = ""; render();
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("sale").addEventListener("change", e => { state.sale = e.target.checked; render(); });
document.getElementById("multi").addEventListener("change", e => { state.multi = e.target.checked; render(); });
document.getElementById("chg").addEventListener("change", e => { state.changes = e.target.checked; render(); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
document.getElementById("ops").addEventListener("click", e => {
  const b = e.target.closest("[data-me]"); if (!b) return;
  const was = state.me;
  state.me = b.dataset.me;
  if (state.me && !was && state.sort === "diff") state.sort = "me";
  if (!state.me) { state.onlyMine = false; if (state.sort === "me") state.sort = "diff"; }
  saveMe(); render();
});
document.getElementById("onlyMine").addEventListener("change", e => { state.onlyMine = e.target.checked; render(); });
document.getElementById("views").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.view = b.dataset.view; render();
});
document.getElementById("brands").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.brand = state.brand === b.dataset.brand ? "" : b.dataset.brand; render();
});
document.getElementById("sizes").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.diag = state.diag === b.dataset.diag ? "" : b.dataset.diag; render();
});
const bodyEl = document.getElementById("body");
bodyEl.addEventListener("click", e => {
  if (e.target.closest("[data-more]")) { state.limit += PAGE; render(); return; }
  const r = e.target.closest("[data-key]"); if (r) openDetail(r.dataset.key, r.dataset.vk);
});
bodyEl.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const r = e.target.closest("[data-key]"); if (r) { e.preventDefault(); openDetail(r.dataset.key, r.dataset.vk); }
});
let wasNarrow = narrow();
window.addEventListener("resize", () => {
  if (narrow() !== wasNarrow) { wasNarrow = narrow(); if (ITEMS.length) render(); }
  if (dlg.open && document.getElementById("chart")) drawHistory();
});

readHash();
load().catch(err => { document.getElementById("sub").textContent = "Neizdevās ielādēt datus: " + err.message; });
</script>
