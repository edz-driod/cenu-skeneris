<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cenu skeneris</title>
<meta name="description" content="Bite, Tele2, LMT un Tet ierīču cenas: izmaiņas, salīdzinājums pēc modeļa un cenu vēsture">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
  :root {
    color-scheme: light;
    --page: #EDF0F3; --surface: #FFFFFF; --hover: #F4F6F8; --sunk: #EDF0F3;
    --ink: #17202B; --ink-2: #4A5563; --muted: #5B6673; --faint: #8A94A1;
    --line: #CDD4DC; --line-2: #E1E6EB;
    --tag: #FFD43B; --tag-ink: #17202B;
    --down: #1F6B3A; --up: #A3322A; --accent: #1D4E9E; --sale: #B4235A;
    --bite: #2FB36B; --tele2: #1D5BC4; --lmt: #F08A24; --tet: #8A3FFC;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0E141B; --surface: #16202A; --hover: #1C2833; --sunk: #111922;
      --ink: #EDF0F3; --ink-2: #B3BDC8; --muted: #9AA5B1; --faint: #6E7A87;
      --line: #2B3846; --line-2: #223040;
      --down: #5BD08A; --up: #FF8A80; --accent: #8AB4FF; --sale: #F57CA8;
      --bite: #34C47A; --tele2: #4C86F0; --lmt: #F08A24; --tet: #A673FF;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0E141B; --surface: #16202A; --hover: #1C2833; --sunk: #111922;
    --ink: #EDF0F3; --ink-2: #B3BDC8; --muted: #9AA5B1; --faint: #6E7A87;
    --line: #2B3846; --line-2: #223040;
    --down: #5BD08A; --up: #FF8A80; --accent: #8AB4FF; --sale: #F57CA8;
    --bite: #34C47A; --tele2: #4C86F0; --lmt: #F08A24; --tet: #A673FF;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--page); color: var(--ink);
    font: 16px/1.45 Archivo, system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  ::selection { background: var(--tag); color: var(--tag-ink); }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 64px; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.bite { background: var(--bite); } .dot.tele2 { background: var(--tele2); }
  .dot.lmt { background: var(--lmt); } .dot.tet { background: var(--tet); }

  /* galvene */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap;
    padding: 20px 0 16px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
  .brand b { font-size: 22px; font-weight: 800; font-stretch: 75%; letter-spacing: -0.01em; }
  .cats { display: flex; gap: 4px; flex-wrap: wrap; }
  .cats button { border: 0; background: none; color: var(--ink-2); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 15px; min-height: 40px; }
  .cats button:hover { background: var(--surface); color: var(--ink); }
  .cats button[aria-selected=true] { background: var(--ink); color: var(--page); font-weight: 600; }
  .updated { margin: 0; font-size: 14px; color: var(--ink-2); }
  .updated .warn { color: var(--up); }

  /* virsraksts un meklēšana */
  .hero { padding: 36px 0 24px; display: grid; gap: 16px; }
  .finder { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 4px 0 24px; }
  .notice { margin: 20px 0 0; font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }

  /* izmaiņas */
  .chgcard { margin: 28px 0 24px; }
  .chgcard h1 { margin: 0; font-size: clamp(40px, 6vw, 60px); line-height: .95; font-weight: 800; font-stretch: 68%; letter-spacing: -0.02em; }
  .ops4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .opcol { padding: 18px 20px 20px; border-right: 1px solid var(--line-2); min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .opcol:last-child { border-right: 0; }
  .opcol.me { background: var(--sunk); }
  .oph { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 24px; line-height: 1; font-weight: 800; font-stretch: 70%; }
  .oph .mine { font-size: 12px; font-weight: 600; font-stretch: 100%; color: var(--ink-2); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
  .opsum { margin: 0 0 4px; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .opsum b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .evs { list-style: none; margin: 0; padding: 0; }
  .ev { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; text-align: left;
    background: none; border: 0; border-top: 1px solid var(--line-2); padding: 10px 0; cursor: pointer; font-size: 14px; color: var(--ink); }
  .ev:hover .en { text-decoration: underline; text-underline-offset: 3px; }
  .ev .en { font-weight: 600; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
  .ev .evk { font-weight: 400; color: var(--ink-2); }
  .ev .ep { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; font-weight: 700; }
  .ev .es { font-size: 12px; color: var(--ink-2); }
  .ev .ed { font-size: 12px; white-space: nowrap; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ev .was { color: var(--ink-2); font-weight: 400; }
  .ev.gone { cursor: default; }
  .ev.gone .ep { color: var(--ink-2); font-weight: 400; text-decoration: line-through; }
  .kind { display: inline-block; font-size: 11px; font-weight: 600; line-height: 1; border: 1px solid currentColor; border-radius: 5px; padding: 2px 5px; }
  .kind.new { color: var(--accent); } .kind.gone { color: var(--ink-2); }
  .evmore { align-self: flex-start; background: none; border: 0; padding: 0; min-height: 36px; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; }
  .opcol .quiet { padding-top: 4px; }
  .meband { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 12px 28px; background: var(--sunk); border-bottom: 1px solid var(--line-2); font-size: 14px; color: var(--ink-2); }
  .meband b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .meband .who { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 700; }
  @media (max-width: 980px) {
    .ops4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .opcol { border-bottom: 1px solid var(--line-2); } .opcol:nth-child(2n) { border-right: 0; }
  }
  .hero h1 { margin: 0; font-size: clamp(44px, 7vw, 64px); line-height: 1; font-weight: 800; font-stretch: 70%; letter-spacing: -0.02em; }
  .search { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 2px solid var(--ink);
    border-radius: 10px; padding: 0 18px; height: 60px; max-width: 720px; }
  .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--ink); font: inherit; font-size: 18px; }
  .search:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  .summary { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 15px; color: var(--ink-2); max-width: 900px; }
  .summary b { color: var(--ink); }

  /* filtri */
  .filters { display: flex; flex-direction: column; gap: 10px; }
  .frow { display: flex; align-items: center; gap: 6px 10px; min-width: 0; }
  .flabel { flex: none; width: 120px; font-size: 14px; color: var(--ink-2); }
  .chips { display: flex; gap: 6px; min-width: 0; flex-wrap: wrap; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-right: 32px;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); }
  .chips.scroll::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 8px; cursor: pointer;
    background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); font-size: 15px; font-weight: 500; white-space: nowrap; }
  .chip:hover { border-color: var(--ink-2); }
  .chip[aria-pressed=true] { background: var(--ink); color: var(--page); border-color: var(--ink); font-weight: 700; }
  .chip .n { font-weight: 400; opacity: .72; font-size: 13px; }
  .hint { font-size: 13px; color: var(--ink-2); }

  /* kartīte ar rezultātiem */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: clip; }
  .card-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px 20px; flex-wrap: wrap;
    padding: 20px 28px 16px; border-bottom: 1px solid var(--line); }
  .ttl { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; min-width: 0; }
  .ttl h2 { margin: 0; font-size: 48px; line-height: .9; font-weight: 800; font-stretch: 65%; }
  .ttl p { margin: 0; font-size: 15px; color: var(--ink-2); }
  .tools { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 9px; overflow: hidden; }
  .seg button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: var(--surface); color: var(--ink);
    min-height: 40px; padding: 0 13px; cursor: pointer; font-size: 15px; }
  .seg button[aria-pressed=true] { background: var(--ink); color: var(--surface); font-weight: 700; }
  .chk { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; min-height: 40px; cursor: pointer; white-space: nowrap; }
  .chk input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); }
  .sel { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
  .sel select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px; }

  .sec { display: flex; align-items: baseline; gap: 12px; padding: 22px 28px 10px; background: var(--sunk); border-bottom: 1px solid var(--line-2); }
  .sec b { font-size: 40px; line-height: .9; font-weight: 800; font-stretch: 65%; }
  .sec span { font-size: 14px; color: var(--ink-2); }

  /* kāpņu rinda */
  .lrow { display: grid; grid-template-columns: minmax(200px, 300px) minmax(240px, 1fr) 200px 16px; gap: 28px; align-items: center;
    padding: 20px 28px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
  .lrow:hover { background: var(--hover); }
  .lrow:hover .chev { color: var(--ink); }
  .lm { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .lm .b { font-size: 13px; color: var(--ink-2); }
  .lm .t { font-size: 17px; font-weight: 600; line-height: 1.25; }
  .lm .c { font-size: 13px; color: var(--ink-2); font-stretch: 80%; letter-spacing: .02em; }
  .chg { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 13px; font-weight: 600; }
  .dn { color: var(--down); } .upc { color: var(--up); }
  .used { display: inline-block; font-size: 11px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; margin-left: 6px; vertical-align: 2px; }
  .chev { color: var(--faint); font-size: 22px; line-height: 1; }

  .lad { position: relative; height: 76px; }
  .lad .track { position: absolute; left: 0; right: 0; top: 17px; height: 2px; background: var(--line); }
  .lad .tick { position: absolute; top: 13px; width: 2px; height: 10px; background: var(--line); }
  .lad .mv { position: absolute; top: 16px; height: 4px; border-radius: 2px; opacity: .35; }
  .lad .ghost { position: absolute; top: 11px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid; background: var(--surface); }
  .cl { position: absolute; top: 11px; display: flex; flex-direction: column; }
  .cl.c { transform: translateX(-50%); align-items: center; text-align: center; }
  .cl.l { align-items: flex-start; text-align: left; }
  .cl.r { transform: translateX(-100%); align-items: flex-end; text-align: right; }
  .cl .dots { display: flex; gap: 3px; align-items: center; }
  .cl .pd { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 3px var(--surface); }
  .cl .pd.me { width: 18px; height: 18px; box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }
  .cl .lbls { display: flex; flex-direction: column; gap: 1px; margin-top: 8px; }
  .cl .lb { font-size: 13px; white-space: nowrap; color: var(--ink-2); }
  .cl .lb b { color: var(--ink); font-weight: 500; }
  .cl .lb.win b { font-weight: 800; }
  .cl .lb .d { font-weight: 600; }
  .fade { opacity: .7; }

  .ptag { position: relative; display: inline-flex; flex-direction: column; line-height: 1.05; background: var(--tag); color: var(--tag-ink);
    border-radius: 6px 14px 14px 6px; padding: 8px 18px 8px 26px; }
  .ptag::before { content: ""; position: absolute; left: 9px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%;
    background: var(--surface); box-shadow: inset 0 0 0 1.5px rgba(23,32,43,.35); }
  .ptag .at { font-size: 13px; font-weight: 600; }
  .ptag .v { font-size: 28px; font-weight: 800; font-stretch: 70%; font-variant-numeric: tabular-nums; }
  .ptag.solo { background: var(--sunk); color: var(--ink); }
  .lt2 { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .note { font-size: 13px; color: var(--ink-2); }

  /* tabula */
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th, .tbl td { padding: 14px 12px; border-bottom: 1px solid var(--line-2); text-align: right; vertical-align: middle; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; padding-left: 28px; }
  .tbl th:last-child, .tbl td:last-child { padding-right: 28px; }
  .tbl thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); box-shadow: inset 0 -1px 0 var(--line);
    font-size: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .tbl thead th .dot { margin-right: 6px; vertical-align: 0; width: 9px; height: 9px; }
  .tbl thead th.me { color: var(--ink); font-weight: 700; }
  .tbl tbody tr[data-key] { cursor: pointer; }
  .tbl tbody tr[data-key]:hover { background: var(--hover); }
  .tbl td.me { background: var(--sunk); }
  .tbl .p { font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl .p.win { display: inline-block; background: var(--tag); color: var(--tag-ink); font-weight: 800; border-radius: 4px 10px 10px 4px; padding: 3px 10px 3px 12px; }
  .tbl .m { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .tbl .from { font-size: 12px; color: var(--ink-2); margin-right: 3px; }
  .tbl .na { color: var(--faint); }
  .tbl .gap { font-weight: 700; white-space: nowrap; }
  .tbl tr.secrow td { background: var(--sunk); text-align: left; padding: 18px 28px 8px; cursor: default; }
  .tbl tr.secrow b { font-size: 32px; font-weight: 800; font-stretch: 65%; margin-right: 10px; }
  .tbl tr.secrow span { font-size: 14px; color: var(--ink-2); }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; line-height: 1; color: var(--sale); border: 1px solid currentColor; border-radius: 5px; padding: 2px 4px; margin-left: 4px; vertical-align: 1px; }

  .more { display: flex; justify-content: center; padding: 18px; }
  .more button { font-weight: 600; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 8px; padding: 10px 20px; min-height: 44px; cursor: pointer; }
  .more button span { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
  .empty { padding: 40px 28px; color: var(--ink-2); margin: 0; }
  .foot { margin: 24px 0 0; font-size: 14px; color: var(--ink-2); max-width: 62ch; line-height: 1.5; }

  /* detaļu logs */
  dialog { border: 0; border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink);
    width: min(1000px, calc(100vw - 24px)); max-height: calc(100vh - 24px); box-shadow: 0 24px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10,16,22,.5); }
  .dlg { padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 22px; }
  .dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .dlg-head .b { font-size: 14px; color: var(--ink-2); }
  .dlg-head h2 { margin: 4px 0 0; font-size: clamp(30px, 5vw, 44px); line-height: 1; font-weight: 800; font-stretch: 72%; }
  .x { width: 44px; height: 44px; flex: none; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  .dlg h3 { margin: 0; font-size: 20px; font-weight: 800; font-stretch: 75%; }
  .vrows { border-top: 1px solid var(--line); }
  .vrow { display: grid; grid-template-columns: 110px minmax(0, 1fr) 190px; gap: 28px; align-items: center; padding: 16px 12px; border-bottom: 1px solid var(--line-2); }
  .vrow.cur { background: var(--sunk); }
  .vrow .vk { font-size: 34px; line-height: .95; font-weight: 800; font-stretch: 65%; }
  .vrow .vk.small { font-size: 20px; }
  .vrow .ptag { text-decoration: none; }
  .shops { display: flex; flex-wrap: wrap; gap: 8px; }
  .shop { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); border: 1.5px solid var(--line);
    border-radius: 8px; padding: 0 14px; min-height: 44px; font-size: 15px; }
  .shop:hover { border-color: var(--ink); }
  .shop b { font-variant-numeric: tabular-nums; }
  .hist-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart text { fill: var(--ink-2); font: 12px Archivo, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 9px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.14); white-space: nowrap; display: none; z-index: 3; }
  .tip .t { color: var(--ink-2); margin-bottom: 2px; }
  .tip .r { display: flex; align-items: center; gap: 6px; }
  .tip b { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
  .events { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14px; margin: 0; padding: 0; list-style: none; }
  .events li { display: flex; align-items: center; gap: 8px; }
  .events .dt { color: var(--ink-2); }
  .quiet { margin: 0; font-size: 14px; color: var(--ink-2); }

  @media (max-width: 760px) {
    .wrap { padding: 0 16px 48px; }
    .top { padding-top: 14px; }
    .cats { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; padding-right: 28px;
      -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
    .cats::-webkit-scrollbar { display: none; }
    .cats button { flex: none; }
    .updated { order: 3; width: 100%; font-size: 13px; }
    .lrow .lad { margin: 0 8px; }
    .tbl tr[data-key] td.op .tag { display: none; }
    .hero { padding: 20px 0 18px; gap: 12px; }
    .search { height: 52px; padding: 0 14px; }
    .frow { flex-wrap: wrap; }
    .flabel { width: 100%; }
    #ops { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); width: 100%; }
    #ops .chip { justify-content: center; padding: 0 4px; font-size: 14px; gap: 5px; }
    .chgcard { margin: 18px -8px 18px; }
    .chgcard h1 { font-size: 40px; }
    .ops4 { grid-template-columns: 1fr; }
    .opcol { border-right: 0; padding: 14px 16px; }
    .meband { padding: 10px 16px; }
    .finder { padding-bottom: 18px; }
    .card { border-radius: 12px; margin: 0 -8px; }
    .card-head { padding: 14px 16px 12px; }
    .ttl h2 { font-size: 38px; }
    .tools { width: 100%; }
    .sec { padding: 16px 16px 8px; }
    .lrow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "m t" "l l" "n n"; gap: 10px 12px; padding: 16px; }

<script>
const OPS = { bite: "Bite", tele2: "Tele2", lmt: "LMT", tet: "Tet" };
const CATS = { telefoni: "Telefoni", pulksteni: "Viedpulksteņi", plansetes: "Planšetes", austinas: "Austiņas", televizori: "Televizori", puteklsuceji: "Putekļsūcēji", kameras: "Kameras" };
// 1 459 € (bez ,00), 899,01 € – centi tikai, ja tie nav nulle; tūkstoši atdalīti ar šauru atstarpi
const fmtNum = (v, dec) => { const [i, f] = Math.abs(v).toFixed(dec).split(".");
  return (v < 0 ? "−" : "") + i.replace(/\B(?=(\d{3})+(?!\d))/g, "\u202f") + (f ? "," + f : ""); };
const eur = v => v == null ? "–" : fmtNum(v, Math.round(v * 100) % 100 === 0 ? 0 : 2) + "\u00a0€";
const eur0 = v => fmtNum(Math.round(v), 0) + "\u00a0€";
const PAGE = 50;
const fmtDate = d => d.toLocaleDateString("lv-LV", { day: "2-digit", month: "2-digit", year: "numeric" });
const fmtDT = d => d.toLocaleString("lv-LV", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = s => s === "" || s == null ? null : +s;

// Viens un tas pats modelis abos operatoros: bez atmiņas apjoma, 5G u.tml.
// Viena un tā pati ierīce visos operatoros: "Xiaomi Redmi Note 15 5G 256GB" (Tele2), "Redmi Note 15" (LMT),
// "Galaxy Watch9 LTE" (Bite), "Galaxy S26 12+256GB Black" (Tet) -> "redmi note 15", "galaxy watch 9", "galaxy s 26".
// Atmiņa, pulksteņa izmērs, krāsa, korpusa materiāls u.c. tiek ignorēti – tie ir viena produkta varianti.
const OPENED = /bojāts iepakojums|izpakot|mazlietot|atjaunot|refurb|demo|pre-?owned/i;  // nav salīdzināms ar jaunu preci
const COLOR_RE = new RegExp("\\b(" + ("black|white|silver|gold|golden|blue|green|red|pink|purple|gray|grey|graphite|midnight|" +
  "starlight|burgundy|slate|navy|cream|beige|orange|yellow|violet|lavender|mint|natural|desert|cosmic|sky|space|jet|rose|" +
  "onyx|obsidian|porcelain|sage|ivory|charcoal|coral|teal|lime|bronze|copper|champagne|olive|ice|icy|shadow|phantom|" +
  "cobalt|emerald|frost|stone|sand|denim|indigo|plum|lilac|peach|mocha|ocean|forest|arctic|polar|dark|light|deep|pale|" +
  "mist|misty|glacier|aurora|nebula|tidal|mystic|jade|marble|pearl|matte?|glossy|brown|melns|balts|zils|zals|sarkans|" +
  "roza|peleks|sudraba|zelta") + ")\\b", "g");
// vārdi, kas apzīmē citu modeli (Pixel 11 Pro XL ≠ Pixel 11 Pro) – tos prefiksu apvienošana neaiztiek
const MODEL_WORDS = new Set(("pro max ultra plus lite mini fe se classic edge fold flip neo active x s e air nc anc fit band " +
  "watch buds kids smart t r note prime power go open studio solo sport xl solar amoled inreach sapphire play wired eq " +
  "carbon dlc slim compact gaming complete").split(" "));
// planšetes: "Galaxy Tab A11+ 11\"" = "Galaxy Tab A11+" – izmērs, kas jau ir modeļa nosaukumā, tiek izmests
const dropDupInch = m => (m || "").replace(/\s*(\d{1,2})(?:[.,]\d)?\s?(?:"|”|″|''|collu|inch)/g, (x, n, i, str) =>
  new RegExp("[^\\d.,]" + n + "(?!\\d)").test(" " + str.slice(0, i) + " " + str.slice(i + x.length) + " ") ? "" : x);
// putekļsūcēji/kameras: ražotāja kods ("RLH71DE-BK", "RLR81CE-WH") – citi veikali to neraksta, tāpēc izmet
const dropCode = m => (m || "").replace(/\b[A-Z]{2,4}\d{2,3}[A-Z]{1,3}(?:-[A-Z0-9]{1,3})*\b/g, " ");
const baseKey = p => baseKey0(p.category === "plansetes" ? { ...p, model: dropDupInch(p.model) }
  : p.category === "puteklsuceji" || p.category === "kameras" ? { ...p, model: dropCode(p.model) } : p);
const baseKey0 = p => p.category + (OPENED.test(p.model || "") ? "|izpakota" : "") + "|" + (`${p.brand || ""} ${p.model || ""}`).toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g, "")         // fēnix -> fenix
  .split("|")[0]                                             // Bite: "AirPods 5 | Wireless Charging Case"
  .replace(/\(.*?\)/g, " ")                                  // iekavās – krāsas, kodi
  .replace(/\b\d+\s?[\/+]\s?\d+\s?(gb|tb)?\b/g, " ")        // 12+256GB, 8/256GB (pirms "+" apstrādes)
  .replace(/([a-z0-9])\+/g, "$1 plus")                      // Galaxy S26+ -> s26 plus
  .replace(/\bbojats iepakojums\b|\bizpakota ierice\b|\bwith .*$/g, " ")
  .replace(/\s-\s/g, " ")
  .replace(/\b\d+\s?[\/+]\s?\d+\s?(gb|tb)?\b/g, " ")        // 12+256GB, 8/256GB
  .replace(/\b\d+\s?(gb|tb)\b/g, " ")
  .replace(/\b\d+\s?mm\b/g, " ")                              // pulksteņa izmērs
  .replace(/\b(aluminium|aluminum|titanium|ceramics?|stainless steel|case|edition|silicone|band|loop|strap|leather|milanese|nylon|fabric|metal|steel)\b/g, " ")
  .replace(COLOR_RE, " ")
  .replace(/(\d)bt\b/g, "$1")                                 // tune 535bt -> tune 535
  .replace(/\b(5g|4g|lte|esim|bt|gps|cellular|dual sim|ds|wi-?fi|bluetooth|wireless|true)\b/g, " ")
  .replace(/([a-z])(\d)/g, "$1 $2")                          // watch9 -> watch 9
  .replace(/[^a-z0-9]+/g, " ").trim()
  .replace(/\b(\w+) \1\b/g, "$1")                             // "trust trust" -> "trust"
  .replace(/^(xiaomi )(redmi|poco)\b/, "$2");                // Xiaomi Redmi -> Redmi

// Prefiksu apvienošana: "samsung galaxy a 57 awesome icyblue" -> "samsung galaxy a 57", ja atlikušie vārdi
// nav cipari vai modeļa apzīmējumi (neparasti krāsu nosaukumi, ko nevar uzskaitīt).
function canonicalKeys(keys) {
  const ks = [...new Set(keys)].sort((a, b) => b.length - a.length), map = {};
  for (const k of ks) {
    let best = null;
    for (const g of ks) {
      if (g.length >= k.length || !k.startsWith(g + " ")) continue;
      if (k.slice(g.length + 1).split(" ").some(w => /\d/.test(w) || MODEL_WORDS.has(w))) continue;
      if (!best || g.length > best.length) best = g;
    }
    map[k] = best || k;
  }
  for (const k in map) { let v = map[k]; while (map[v] !== v) v = map[v]; map[k] = v; }
  return map;
}
const modelKey = baseKey;

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const [head, ...body] = rows;
  return body.filter(r => r.length === head.length).map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}

let ITEMS = [], HIST = {}, NOW = new Date(), META = null, VARIANTS = {}, CATFIRST = {},
  state = { limit: PAGE, view: "ladder", cat: "telefoni", q: "", me: "", onlyMine: false, brand: "", diag: "", sale: false, multi: true,
    changes: true, sort: "diff", period: 7, open: {}, dlg: "", dlgVk: "", page: "", acat: "" };
// "Mans operators" – katram skatītājam savs, glabājas pārlūkā
const ME_KEY = "cenu-skeneris.me";
try { const m = localStorage.getItem(ME_KEY); if (m && OPS[m]) state.me = m; } catch (e) {}
const saveMe = () => { try { state.me ? localStorage.setItem(ME_KEY, state.me) : localStorage.removeItem(ME_KEY); } catch (e) {} };
const onSale = p => p.disc > 0 || (p.monthly_old && p.monthly_old > p.monthly);

async function load() {
  const [csv, latest, meta, variants] = await Promise.all([
    fetch("data/prices.csv", { cache: "no-store" }).then(r => r.ok ? r.text() : ""),
    fetch("data/latest.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}),
    fetch("data/meta.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch("data/variants.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  ]);
  META = meta; VARIANTS = variants || {};
  if (meta?.scanned_at) NOW = new Date(meta.scanned_at);

  for (const r of csv ? parseCSV(csv) : []) {
    const key = `${r.operator}:${r.id}`;
    const t = new Date(r.scanned_at), ck = `${r.operator}/${r.category || "telefoni"}`;
    (HIST[key] ||= []).push({ t, full: num(r.full), monthly: num(r.monthly) });
    if (!CATFIRST[ck] || t < CATFIRST[ck]) CATFIRST[ck] = t;
  }
  for (const h of Object.values(HIST)) h.sort((a, b) => a.t - b.t);

  ITEMS = Object.entries(latest).map(([key, p]) => ({ ...p, category: p.category || "telefoni", key })).map(p => {
    const key = p.key;
    const h = HIST[key] || [];
    const fulls = h.map(x => x.full).concat(p.full).filter(v => v != null);
    const min = fulls.length ? Math.min(...fulls) : null;
    const disc = p.full_old && p.full ? p.full_old - p.full : null;
    return { ...p, key, mk: baseKey(p), min, disc, name: `${p.brand || ""} ${p.model || ""}`.trim(), since: h[0]?.t };
  });
  const canon = canonicalKeys(ITEMS.map(p => p.mk));
  ITEMS.forEach(p => { p.mk = canon[p.mk]; });
  // ražotājs: viena rakstība ("SAMSUNG"/"Samsung"), Redmi/POCO -> Xiaomi, Huami -> Amazfit
  const spell = {};
  for (const p of ITEMS) { const k = brandKey(p.brand); (spell[k] ||= {})[p.brand] = (spell[k][p.brand] || 0) + 1; }
  ITEMS.forEach(p => {
    const k = brandKey(p.brand);
    p.brandN = BRAND_ALIAS[k] || Object.entries(spell[k] || {}).sort((a, b) => b[1] - a[1] || (/[a-z]/.test(b[0]) - /[a-z]/.test(a[0])))[0]?.[0] || p.brand || "Cits";
    p.search = searchNorm(`${p.brand} ${p.brandN} ${p.model}`);
  });
  prepareTV();

  render();
  if (state.dlg) openDetail(state.dlg, state.dlgVk, { fromUrl: true });
}

const BRAND_ALIAS = { redmi: "Xiaomi", poco: "Xiaomi", xiaomi: "Xiaomi", huami: "Amazfit", amazfit: "Amazfit", beats: "Beats" };
const brandKey = b => (b || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
// meklēšana: "watch 9" atrod "Watch9", "fenix" atrod "fēnix"
const searchNorm = t => (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/([a-z])(\d)/g, "$1 $2").replace(/(\d)([a-z])/g, "$1 $2").replace(/[^a-z0-9]+/g, " ").trim();

function baseFilter(p, ignoreBrand) {
  const q = searchNorm(state.q);
  return (!state.cat || p.category === state.cat)
    && (ignoreBrand || !state.brand || p.brandN === state.brand)
    && (!q || q.split(" ").every(w => (" " + p.search + " ").includes(" " + w) ));
}

/* ---------- Salīdzinājums: viena rinda katram modelim, kolonna katram operatoram ---------- */
function buildGroups(items) {
  const g = new Map();
  for (const p of items) {
    if (!g.has(p.mk)) g.set(p.mk, { mk: p.mk, items: [], byOp: {} });
    const grp = g.get(p.mk);
    grp.items.push(p);
    (grp.byOp[p.operator] ||= []).push(p);
  }
  for (const grp of g.values()) {
    for (const list of Object.values(grp.byOp)) list.sort((a, b) => (a.full ?? Infinity) - (b.full ?? Infinity));
    grp.best = Object.fromEntries(Object.entries(grp.byOp).map(([op, l]) => [op, l[0]]));
    const prices = Object.values(grp.best).map(p => p.full).filter(v => v != null);
    grp.nOps = Object.keys(grp.byOp).length;
    grp.min = prices.length ? Math.min(...prices) : null;
    grp.diff = null; grp.diffVk = null;
    // nosaukums: īsākais (parasti bez atmiņas/krāsas piebildēm)
    const rep = [...grp.items].sort((a, b) => a.name.length - b.name.length)[0];
    const multiVariant = grp.items.length > grp.nOps;
    const clean = m => multiVariant
      ? m.split("|")[0].replace(/\(.*?\)/g, "").replace(/\s*-?\s*\b\d+\s?mm\b/gi, "")
          .replace(/\b\d+\s?\/?\s?\d*\s?(GB|TB)\b/gi, "").replace(/\b(LTE|BT|eSIM|5G|4G)\b/gi, "")
          .replace(/\s+/g, " ").trim()
      : m;
    grp.brand = rep.brand; grp.model = clean(rep.model || ""); grp.name = `${rep.brand || ""} ${grp.model}`.trim(); grp.category = rep.category;
    if (grp.category === "televizori") {
      const set = new Set(grp.items), us = TV_UNITS.filter(u => set.has(u.item));
      const code = us.find(u => u.info?.series)?.info.series.replace(/^(QE|UE|MRE|TQ|GQ)/, "");
      grp.model = tvTitle(us) || grp.model; grp.brand = rep.brandN || rep.brand;
      if (code && !grp.model.toUpperCase().includes(code)) grp.model += ` · ${code}`;
      grp.name = `${grp.brand} ${grp.model}`;
    }
    for (const op of Object.keys(OPS)) grp[op] = grp.best[op]?.full ?? null;
    // starpība tikai starp vienādiem variantiem (piem. 256 GB pret 256 GB), nevis "no" cenām
    if (grp.nOps > 1) {
      const byVk = {};
      for (const r of skuRows(grp)) { const m = (byVk[r.vk] ||= {}); m[r.op] = Math.min(m[r.op] ?? Infinity, r.full); }
      for (const [vk, m] of Object.entries(byVk)) {
        const v = Object.values(m);
        if (v.length > 1 && Math.max(...v) - Math.min(...v) > (grp.diff ?? -1)) { grp.diff = Math.max(...v) - Math.min(...v); grp.diffVk = vk; }
      }
    }
  }
  return [...g.values()];
}

/* ---------- Televizori: sasaiste pēc ražotāja koda un diagonāles ---------- */
// Bite/Tele2/Tet raksta ražotāja kodu nosaukumā ("QE65QN80HAUXXH", "55PUS8001/12", "OLED65C61LA"),
// LMT – produkta lapā katram izmēram (variants.json). Kodā parasti ir diagonāle (65) un sērija (QN80H).
// Viens SKU = sērija + diagonāle. Ja koda nav (Tele2 Xiaomi) vai tajā nav izmēra (Xiaomi ELA…), sēriju nosaka pēc nosaukuma.
const TV_GENERIC = new Set(("4k 8k uhd hd fhd smart tv televizors televizori google android vision ai hdr hdr10 dolby atmos " +
  "ambilight evo the ar un inch collas cm qled qd led").split(" "));
const TV_SIZE_RE = /(\d{2,3})\s*(?:"|''|”|″|’’|-?\s?collas|\s?inch|\s?colla)/i;

function tvCode(model) {
  const toks = (model || "").replace(/[()]/g, " ").split(/\s+/).filter(Boolean);
  for (let i = toks.length - 1; i >= 0; i--) {
    const t = toks[i];
    if (!/^[A-Z0-9][A-Z0-9\-\/\.]{3,}$/.test(t) || t !== t.toUpperCase()) continue;
    if ((t.match(/\d/g) || []).length < 2 || !/[A-Z]/.test(t) || /^\d{4}$/.test(t) || /^\d+K$/.test(t)) continue;
    return t;
  }
  return null;
}

// -> { core: "QE65QN80H", size: 65, series: "QEQN80H" } vai null
function tvCodeInfo(brand, code) {
  if (!code) return null;
  let c = code.toUpperCase().split(/[\/.]/)[0].replace(/[^A-Z0-9]/g, "");
  const b = (brand || "").toLowerCase();
  if (b === "samsung") {
    // QE65QN80HAUXXH -> QE65QN80H; QE65LS03HWUXXH -> QE65LS03HW (cita versija); QE55S90HAEXXH -> QE55S90H
    const m = c.replace(/A?[A-Z]XXH$|XXH$/, "").match(/^([A-Z]{2,3})(\d{2,3})([A-Z]+\d+[A-Z0-9]*)$/);
    if (m) return { core: m[1] + m[2] + m[3], size: +m[2], series: m[1] + m[3] };
  }
  if (b === "lg") c = c.replace(/(\d)[A-Z]+$/, "$1");          // OLED65G61LW -> OLED65G61, 65QNED70B3A -> 65QNED70B3
  const m = c.match(/^([A-Z]{0,6})(\d{2,3})(?=[A-Z])/);         // pirmais skaitlis kodā = diagonāle
  if (m && +m[2] >= 19 && +m[2] <= 120) return { core: c, size: +m[2], series: c.slice(0, m[1].length) + c.slice(m[1].length + m[2].length) };
  return { core: c, size: null, series: null };
}

function tvNameSeries(brand, model) {
  const t = (model || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const year = (t.match(/\b(20\d\d)\b/) || [])[1] || "";
  const code = tvCode(model);
  const toks = t.replace(code ? code.toLowerCase() : "\u0000", " ").replace(/(\d{2,3})\s*("|''|”|″|’’|-?\s?collas|\s?inch)/g, " ")
    .replace(/[^a-z0-9]+/g, " ").split(" ").filter(w => w && !TV_GENERIC.has(w) && !/^20\d\d$/.test(w) && !/^\d{2,3}$/.test(w));
  return { tokens: [...new Set(toks)].sort().join(" "), year };
}

const tvDiagFrom = (...texts) => { for (const t of texts) { const m = (t || "").match(TV_SIZE_RE) || (t || "").match(/[-\/](\d{2,3})-collas/); if (m && +m[1] >= 19 && +m[1] <= 120) return +m[1]; } return null; };

// Visas konkrētās televizoru vienības (SKU līmenī) no precēm; LMT – no variants.json
function tvUnitsOf(p) {
  const vs = VARIANTS[p.key]?.variants;
  const mk = (code, diag, full, url, label, old) => {
    const info = tvCodeInfo(p.brandN || p.brand, code);
    return { item: p, op: p.operator, code, info, diag: info?.size || diag, full, full_old: old ?? null, url, label,
      monthly: vs ? null : p.monthly };
  };
  if (vs?.length) return vs.filter(v => v.full != null).map(v => mk(v.sku, tvDiagFrom(v.label, v.url), v.full, v.url, `${p.model} · ${v.sku || v.label}`, v.full_old));
  return [mk(tvCode(p.model), tvDiagFrom(p.model, p.url), p.full, p.url, p.model, p.full_old)];
}

// Piešķir sērijas atslēgu visām TV vienībām un precēm (p.mk), lai detaļu logs rādītu visus izmērus.
let TV_UNITS = [];
function prepareTV() {
  const tvItems = ITEMS.filter(p => p.category === "televizori" && !OPENED.test(p.model || ""));
  TV_UNITS = tvItems.flatMap(tvUnitsOf).filter(u => u.full != null);
  // 1) pēc koda
  for (const u of TV_UNITS) if (u.info?.series) u.series = `${brandKey(u.item.brandN)}|c|${u.info.series}`;
  const codeSeries = {};
  for (const u of TV_UNITS) if (u.series) (codeSeries[brandKey(u.item.brandN)] ||= new Set()).add(u.info.series);
  // 2) bez koda: vai nosaukumā ir vārds, kas viennozīmīgi atbilst kādai koda sērijai (piem. "M80H", "C61")?
  const byName = {};
  for (const u of TV_UNITS) {
    if (u.series) continue;
    const b = brandKey(u.item.brandN), ns = tvNameSeries(u.item.brandN, u.item.model);
    const hints = ns.tokens.split(" ").filter(w => w.length >= 3 && /\d/.test(w) && /[a-z]/.test(w)).map(w => w.toUpperCase());
    const cands = [...(codeSeries[b] || [])].filter(s => hints.some(h => s.endsWith(h) || s.replace(/^[A-Z]{2,4}(?=[A-Z])/, "") === h));
    if (cands.length === 1) { u.series = `${b}|c|${cands[0]}`; continue; }
    u.nameKey = `${b}|n|${ns.tokens}`; u.year = ns.year;
    (byName[u.nameKey] ||= []).push(u);
  }
  // 3) nosaukuma sērijas: gads tikai atdala, ja abiem ir gads (A Pro 2025 ≠ A Pro 2026)
  for (const [k, us] of Object.entries(byName)) {
    const years = {}; for (const u of us) if (u.year) years[u.year] = (years[u.year] || 0) + 1;
    const main = Object.entries(years).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
    for (const u of us) u.series = `${k}|${u.year || main}`;
  }
  for (const u of TV_UNITS) u.sku = `${u.series}|${u.diag || "?"}`;
  // preces sērija = tās (pirmās) vienības sērija
  for (const p of tvItems) { const u = TV_UNITS.find(x => x.item === p); if (u) p.mk = "televizori|" + u.series; }
}

const TV_TITLE_CLEAN = s => (s || "").replace(/^\s*\d{2,3}\s*("|''|”|″|’’)\s*\/?\s*/, "").replace(/\bSmart TV\b/gi, "")
  .replace(/\s+/g, " ").trim();
function tvTitle(units) {
  const named = units.map(u => {
    let t = TV_TITLE_CLEAN(u.item.model); if (u.code) t = t.replace(u.code, "");
    return { op: u.op, t: t.replace(/\s+/g, " ").trim() };
  }).filter(x => x.t && x.t.length > 2);
  const pick = named.find(x => x.op === "lmt") || named.filter(x => x.op !== "tele2").sort((a, b) => a.t.length - b.t.length)[0] || named[0];
  return pick?.t || "";
}

function tvRows(items) {
  const set = new Set(items);
  const g = new Map();
  for (const u of TV_UNITS) {
    if (!set.has(u.item)) continue;
    if (!g.has(u.sku)) g.set(u.sku, { sku: u.sku, units: [], byOp: {} });
    const r = g.get(u.sku); r.units.push(u);
    if (!r.byOp[u.op] || u.full < r.byOp[u.op].full) r.byOp[u.op] = u;
  }
  return [...g.values()].map(r => {
    const prices = Object.values(r.byOp).map(u => u.full);
    const u0 = r.units.find(u => u.info?.core) || r.units[0];
    r.diag = u0.diag; r.nOps = prices.length; r.min = Math.min(...prices);
    r.diff = prices.length > 1 ? Math.max(...prices) - r.min : null;
    r.brand = u0.item.brandN; r.code = u0.info?.core || ""; r.title = tvTitle(r.units);
    r.name = `${r.brand} ${r.title}`; r.key = u0.item.key;
    for (const op of Object.keys(OPS)) r[op] = r.byOp[op]?.full ?? null;
    return r;
  });
}

/* ---------- Precīzie varianti (SKU) ---------- */
// No nosaukuma/varianta apraksta izvelk to, kas ietekmē cenu: telefoniem atmiņu, pulksteņiem izmēru un LTE.
function variantKey(text, category) {
  const t = (" " + (text || "") + " ").toLowerCase().replace(/[-_]/g, " ");
  if (category === "telefoni" || category === "plansetes") {
    const all = [...t.matchAll(/(\d+)\s?(gb|tb)\b/g)];
    // "8 256 gb" (LMT slug) / "12+256gb" -> 256; ja vienīgais skaitlis ir RAM (≤16 GB) un ir vēl viens – ņem lielāko
    let best = null;
    for (const m of all) { const gb = m[2] === "tb" ? +m[1] * 1024 : +m[1]; if (gb >= 32 && (!best || gb > best)) best = gb; }
    if (!best) { const pair = t.match(/\b(\d{1,2})\s(\d{2,4})\s?gb\b/); if (pair) best = +pair[2]; }
    const mem = best ? (best >= 1024 ? best / 1024 + " TB" : best + " GB") : "";
    if (category === "plansetes") return [mem, /\b(lte|5g|4g|cellular|sim)\b/.test(t) ? "LTE" : ""].filter(Boolean).join(" · ");
    return mem;
  }
  if (category === "pulksteni") {
    const size = t.match(/\b(\d{2})\s?mm\b/), lte = /\b(lte|esim|cellular)\b/.test(t);
    return [size ? size[1] + " mm" : "", lte ? "LTE" : ""].filter(Boolean).join(" · ");
  }
  return "";
}
const vkOrder = k => { const n = parseFloat(k) || 0; return (/tb/i.test(k) ? n * 1024 : n) + (/LTE/.test(k) ? 0.5 : 0); };

// Visi zināmie konkrētie varianti grupai: Bite/LMT no variants.json, Tele2/Tet – katra prece pati par sevi.
function skuRows(g) {
  if (g.category === "televizori") {
    const set = new Set(g.items);
    return TV_UNITS.filter(u => set.has(u.item)).map(u => ({ op: u.op, vk: u.diag ? u.diag + "″" : "", full: u.full, url: u.url, label: u.label }));
  }
  const rows = [];
  for (const p of g.items) {
    const vs = VARIANTS[p.key]?.variants;
    if (vs?.length) for (const v of vs) {
      const lab = (v.label || "").replace(/^(\d{2})(?=\s*(,|$))/, "$1 mm");   // Bite pulksteņi: "40, Balts" -> "40 mm, Balts"
      rows.push({ op: p.operator, vk: variantKey(`${p.model} ${lab}`, g.category), full: v.full, url: v.url, label: v.label });
    }
    else rows.push({ op: p.operator, vk: variantKey(p.model, g.category), full: p.full, url: p.url, label: p.model });
  }
  return rows.filter(r => r.full != null);
}

const VARIANT_CATS = new Set(["telefoni", "pulksteni", "plansetes", "televizori"]);
/* ---------- Grafiks: pakāpju līnija (cena ir spēkā līdz nākamajai izmaiņai) ---------- */
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 50; max += 50; }
  const span = max - min, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + 1e-9; v += step) t.push(v);
  return t;
}

function drawChart(el, series) {
  const W = el.clientWidth || 600, H = 230, M = { t: 12, r: 96, b: 26, l: 52 };
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const all = series.flatMap(s => s.pts);
  let t0 = Math.min(...all.map(p => +p.t)), t1 = +NOW;
  if (t1 - t0 < 864e5) t0 = t1 - 864e5;               // vismaz 1 diena
  const yt = niceTicks(Math.min(...all.map(p => p.v)), Math.max(...all.map(p => p.v)));
  const y0 = yt[0], y1 = yt[yt.length - 1];
  const X = t => M.l + (t - t0) / (t1 - t0) * iw;
  const Y = v => M.t + ih - (v - y0) / (y1 - y0) * ih;
  const color = op => `var(--${op})`;

  const at = (s, t) => { let v = null; for (const p of s.pts) { if (+p.t <= t) v = p.v; else break; } return v; };

  // x ass ķeksīši: ~4 datumi
  const short = W < 520, nx = short ? (t1 - t0 < 3 * 864e5 ? 1 : 2) : 3;
  const xt = []; for (let i = 0; i <= nx; i++) xt.push(t0 + (t1 - t0) * i / nx);
  const xLabel = t => (t1 - t0 < 3 * 864e5) ? fmtDT(new Date(t))
    : short ? new Date(t).toLocaleDateString("lv-LV", { day: "2-digit", month: "2-digit" }) : fmtDate(new Date(t));

  const paths = series.map(s => {
    let d = "";
    s.pts.forEach((p, i) => {
      const x = X(+p.t), y = Y(p.v);
      d += i === 0 ? `M${x},${y}` : `H${x}V${y}`;
    });
    d += `H${X(t1)}`;
    return d;
  });

  // tiešie marķējumi līnijas galā; ja pārklājas, pabīda
  const ends = series.map((s, i) => ({ i, y: Y(s.pts[s.pts.length - 1].v), v: s.pts[s.pts.length - 1].v }))
    .sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;

  el.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Cenu vēstures grafiks">
    ${yt.map(v => `<line x1="${M.l}" x2="${W - M.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-2)"/>
      <text x="${M.l - 8}" y="${Y(v) + 4}" text-anchor="end">${eur0(v)}</text>`).join("")}
    <line x1="${M.l}" x2="${W - M.r}" y1="${M.t + ih}" y2="${M.t + ih}" stroke="var(--line)"/>
    ${xt.map((t, i) => `<text x="${X(t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === nx ? "end" : "middle"}">${xLabel(t)}</text>`).join("")}
    ${paths.map((d, i) => `<path d="${d}" fill="none" stroke="${color(series[i].op)}" stroke-width="2.5" stroke-linejoin="round"/>`).join("")}
    ${series.map(s => s.pts.map(p => `<circle cx="${X(+p.t)}" cy="${Y(p.v)}" r="4" fill="${color(s.op)}" stroke="var(--surface)" stroke-width="2"/>`).join("")).join("")}
    ${ends.map(e => `<text x="${W - M.r + 6}" y="${e.y + 4}" style="fill:var(--ink-2)">${esc(series[e.i].label)} ${eur0(e.v)}</text>`).join("")}
    <line id="xh" y1="${M.t}" y2="${M.t + ih}" stroke="var(--line)" style="display:none"/>
    <g id="hdots"></g>
    <rect x="${M.l}" y="${M.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/>
  </svg><div class="tip" id="tip"></div>`;

  const svg = el.querySelector("svg"), tip = el.querySelector("#tip"), xh = el.querySelector("#xh"), hd = el.querySelector("#hdots");
  const move = ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width;
    const t = t0 + Math.max(0, Math.min(1, (sx - M.l) / iw)) * (t1 - t0), x = X(t);
    xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.style.display = "";
    const vals = series.map(s => ({ s, v: at(s, t) }));
    hd.innerHTML = vals.filter(o => o.v != null).map(o => `<circle cx="${x}" cy="${Y(o.v)}" r="5" fill="${color(o.s.op)}" stroke="var(--surface)" stroke-width="2"/>`).join("");
    tip.innerHTML = `<div class="t">${fmtDT(new Date(t))}</div>` + vals.map(o =>
      `<div class="r"><span class="dot ${o.s.op}"></span>${esc(o.s.label)}<b>${o.v == null ? "–" : eur(o.v)}</b></div>`).join("");
    tip.style.display = "block";
    const px = x * r.width / W, tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, px + 12), r.width - tw) + "px";
    tip.style.top = "6px";
  };
  const leave = () => { tip.style.display = "none"; xh.style.display = "none"; hd.innerHTML = ""; };
  const hit = el.querySelector("#hit");
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", leave);
}


/* ================= Jaunais attēlojums: kāpnes, tabula, saraksts ================= */
const isUsed = p => OPENED.test(p.model || "");
const narrow = () => window.matchMedia("(max-width: 760px)").matches;
const opsAll = () => Object.keys(OPS).filter(op => ITEMS.some(p => p.operator === op));
const WEEK = 7 * 864e5;

// cena pirms 7 dienām (pēdējā zināmā līdz tam brīdim; ja vēsture īsāka – pirmā zināmā)
function prevPrice(item) {
  const h = (HIST[item.key] || []).filter(e => e.full != null);
  if (!h.length) return null;
  const cut = +NOW - WEEK;
  let v = null;
  for (const e of h) { if (+e.t <= cut) v = e.full; else break; }
  return v ?? h[0].full;
}
// LMT televizoru varianti: vēsture ir tikai "no" cenai, tāpēc der tikai, ja vienība ir tā pati cena
const unitPrev = u => VARIANTS[u.item.key]?.variants?.length ? (u.full === u.item.full ? prevPrice(u.item) : null) : prevPrice(u.item);

function finishRow(r) {
  const vals = Object.values(r.prices).map(x => x.v);
  r.ops = Object.keys(r.prices);
  r.nOps = r.ops.length;
  r.min = Math.min(...vals); r.max = Math.max(...vals);
  r.tie = r.min === r.max;
  r.winners = r.nOps > 1 && !r.tie ? r.ops.filter(op => r.prices[op].v === r.min) : [];
  r.drop = 0;
  for (const op of r.ops) {
    const x = r.prices[op];
    x.delta = x.prev != null && x.prev !== x.v ? x.v - x.prev : 0;
    r.drop = Math.min(r.drop, x.delta);
  }
  r.changed = r.ops.some(op => r.prices[op].delta);
  return r;
}

function rowFromGroup(g) {
  const prices = {};
  for (const [op, list] of Object.entries(g.byOp)) {
    const b = list[0];
    const prevs = list.map(x => prevPrice(x) ?? x.full).filter(v => v != null);
    prices[op] = { v: b.full, from: list.length > 1, m: b.monthly, sale: list.some(onSale), url: b.url,
      prev: prevs.length ? Math.min(...prevs) : null };
  }
  return finishRow({ key: g.items[0].key, vk: g.diffVk || "", brand: g.brand, title: g.model, code: "", cat: g.category,
    used: isUsed(g.items[0]), diff: g.diff, diffVk: g.diffVk || "", prices, items: g.items, name: g.name });
}

function rowFromTv(t) {
  const prices = {};
  for (const [op, u] of Object.entries(t.byOp))
    prices[op] = { v: u.full, from: false, m: op === "lmt" ? null : (u.monthly ?? u.item.monthly), url: u.url,
      sale: onSale(u.item) || (u.full_old && u.full_old > u.full), prev: unitPrev(u) };
  return finishRow({ key: t.key, vk: t.diag ? t.diag + "″" : "", brand: t.brand, title: t.title || t.code, code: t.code,
    cat: "televizori", diag: t.diag, diff: t.diff, diffVk: t.diag ? t.diag + "″" : "", prices,
    items: t.units.map(u => u.item), name: t.name });
}

function allRows() {
  const items = ITEMS.filter(p => baseFilter(p));
  if (state.cat === "televizori") return tvRows(items).map(rowFromTv);
  return buildGroups(items).map(rowFromGroup);
}

function filterRows(rows) {
  return rows.filter(r => (!state.multi || r.nOps > 1)
    && (!state.onlyMine || !state.me || r.prices[state.me])
    && (!state.sale || r.ops.some(op => r.prices[op].sale)));
}

function sortRows(rows) {
  const s = state.sort, nm = (a, b) => a.name.localeCompare(b.name, "lv");
  const cmp = {
    diff: (a, b) => (b.diff ?? -1) - (a.diff ?? -1) || nm(a, b),
    price: (a, b) => a.min - b.min || nm(a, b),
    change: (a, b) => a.drop - b.drop || (b.diff ?? -1) - (a.diff ?? -1) || nm(a, b),
    name: nm,
    me: (a, b) => (b.meg?.gap ?? -Infinity) - (a.meg?.gap ?? -Infinity) || nm(a, b),
  }[s === "me" && !state.me ? "diff" : s] || nm;
  rows.sort((a, b) => (a.used - b.used) || (state.cat === "televizori" ? (a.diag || 999) - (b.diag || 999) : 0) || cmp(a, b));
  return rows;
}

/* ---------- Mans operators: salīdzinājums ar lētāko konkurentu tajā pašā variantā ---------- */
function vkPrices(r) {
  if (r._vk) return r._vk;
  let byVk = {};
  if (r.cat === "televizori") byVk = { [r.vk]: Object.fromEntries(Object.entries(r.prices).map(([o, x]) => [o, x.v])) };
  else for (const s of skuRows({ category: r.cat, items: r.items })) { const m = (byVk[s.vk] ||= {}); m[s.op] = Math.min(m[s.op] ?? Infinity, s.full); }
  return (r._vk = byVk);
}
// -> { vk, mine, best, gap, pct }: gap > 0 – mans operators dārgāks par lētāko konkurentu, gap < 0 – lētāks par nākamo
function meGap(r, me = state.me) {
  if (!me || !r.prices[me] || r.nOps < 2) return null;
  const cands = Object.entries(vkPrices(r)).filter(([, m]) => m[me] != null && Object.keys(m).length > 1);
  if (!cands.length) return null;
  const [vk, m] = cands.find(([k]) => k === r.diffVk)
    || cands.sort((a, b) => Object.keys(b[1]).length - Object.keys(a[1]).length || vkOrder(a[0]) - vkOrder(b[0]))[0];
  const best = Math.min(...Object.entries(m).filter(([o]) => o !== me).map(([, v]) => v)), mine = m[me];
  return { vk, mine, best, gap: mine - best, pct: (mine - best) / best * 100 };
}
const money = v => Math.abs(v) >= 10 ? eur0(Math.abs(v)) : eur(Math.abs(v));

/* ---------- Kāpnes: viena līnija, punkts katram veikalam ---------- */
const deltaTxt = d => (d < 0 ? "▼ " : "▲ ") + eur0(Math.abs(d)).replace(/^−/, "");
function ladder(prices, { changes = false, me = "", winners = [] } = {}) {
  const ops = Object.keys(prices).sort((a, b) => prices[a].v - prices[b].v || a.localeCompare(b));
  if (!ops.length) return `<div class="lad"></div>`;
  const vals = ops.map(op => prices[op].v);
  if (changes) for (const op of ops) if (prices[op].delta) vals.push(prices[op].prev);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo;
  const X = v => span ? (v - lo) / span : (ops.length > 1 ? 0.5 : 0);
  // tuvus punktus apvieno vienā grupā, lai uzraksti nepārklājas
  const thr = narrow() ? 0.34 : 0.22, clusters = [];
  for (const op of ops) {
    const x = X(prices[op].v), last = clusters[clusters.length - 1];
    if (last && x - last.x0 < thr) last.ops.push(op); else clusters.push({ x0: x, ops: [op] });
  }
  let html = `<div class="track"></div><div class="tick" style="left:0"></div><div class="tick" style="left:calc(100% - 2px)"></div>`;
  if (changes) for (const op of ops) {
    const p = prices[op]; if (!p.delta) continue;
    const a = X(p.prev) * 100, b = X(p.v) * 100;
    html += `<div class="mv" style="left:${Math.min(a, b)}%;width:${Math.abs(a - b)}%;background:var(--${op})"></div>
      <div class="ghost" style="left:${a}%;border-color:var(--${op})" title="${OPS[op]} pirms 7 dienām: ${eur(p.prev)}"></div>`;
  }
  let tall = 1;
  for (const c of clusters) {
    const x = c.ops.reduce((s, op) => s + X(prices[op].v), 0) / c.ops.length;
    const al = x < 0.12 ? "l" : x > 0.88 ? "r" : "c";
    const pos = al === "l" ? `calc(${x * 100}% - 7px)` : al === "r" ? `calc(${x * 100}% + 7px)` : `${x * 100}%`;
    tall = Math.max(tall, c.ops.length);
    html += `<div class="cl ${al}" style="left:${pos}"><div class="dots">${c.ops.map(op =>
      `<span class="pd${op === me ? " me" : ""}" style="background:var(--${op})" title="${OPS[op]}: ${eur(prices[op].v)}"></span>`).join("")}</div>
      <div class="lbls">${c.ops.map(op => { const p = prices[op];
        return `<span class="lb${winners.includes(op) ? " win" : ""}${me && op !== me && !winners.includes(op) ? " fade" : ""}">${p.from ? "no " : ""}<b>${eur(p.v)}</b> ${OPS[op]}${changes && p.delta ? ` <span class="d ${p.delta < 0 ? "dn" : "upc"}">${deltaTxt(p.delta)}</span>` : ""}</span>`; }).join("")}</div></div>`;
  }
  return `<div class="lad" style="height:${44 + tall * 19}px">${html}</div>`;
}

function meNote(r) {
  const me = state.me;
  if (!me) return null;
  if (!r.prices[me]) return `${OPS[me]} šī modeļa nav`;
  const g = r.meg ?? meGap(r);
  if (!g) return null;
  const vk = g.vk ? ` · ${esc(g.vk)}` : "";
  if (Math.abs(g.gap) < 0.005) return `${OPS[me]} vienāds ar lētāko${vk}`;
  return g.gap > 0 ? `${OPS[me]} dārgāks par ${money(g.gap)} (+${pct1(g.pct)})${vk}`
    : `${OPS[me]} lētākais, par ${money(g.gap)} zem nākamā${vk}`;
}

function tagFor(r) {
  const mn = meNote(r);
  if (r.nOps === 1) { const op = r.ops[0];
    return { tag: `<span class="ptag solo"><span class="at">Tikai ${OPS[op]}</span><span class="v">${eur(r.min)}</span></span>`, note: mn ?? "Citos veikalos nav" }; }
  if (r.tie) return { tag: `<span class="ptag solo"><span class="at">Visur vienādi</span><span class="v">${eur(r.min)}</span></span>`, note: mn ?? `${r.nOps} veikalos` };
  const w = r.winners.map(op => OPS[op]).join(", ");
  const note = mn ?? (r.diff ? `Starpība ${money(r.diff)}${r.diffVk ? " (" + esc(r.diffVk) + ")" : ""}` : "");
  return { tag: `<span class="ptag"><span class="at">Lētāk ${esc(w)}</span><span class="v">${eur(r.min)}</span></span>`, note };
}

function rowMeta(r) {
  const chg = state.changes && r.changed ? `<div class="chg">${r.ops.filter(op => r.prices[op].delta).map(op => {
    const d = r.prices[op].delta; return `<span class="${d < 0 ? "dn" : "upc"}">${deltaTxt(d)} ${OPS[op]}</span>`; }).join("")}</div>` : "";
  return `<div class="lm"><span class="b">${esc(r.brand)}${state.cat ? "" : " · " + CATS[r.cat]}</span>
    <span class="t">${esc(r.title)}${r.used ? '<span class="used">lietots</span>' : ""}</span>
    ${r.code ? `<span class="c">${esc(r.code)}</span>` : ""}${chg}</div>`;
}

function ladderRow(r) {
  const t = tagFor(r);
  return `<div class="lrow" role="button" tabindex="0" data-key="${esc(r.key)}" data-vk="${esc(r.vk)}" aria-label="${esc(r.name)}: lētākā cena ${eur(r.min)}">
    ${rowMeta(r)}
    ${ladder(r.prices, { changes: state.changes, me: state.me, winners: r.winners })}
    <div class="lt2">${t.tag}${t.note ? `<span class="note">${t.note}</span>` : ""}</div>
    ${t.note ? `<span class="mnote">${t.note}</span>` : ""}
    <span class="chev" aria-hidden="true">›</span>
  </div>`;
}

const secHead = (diag, n) => diag
  ? `<b>${diag}″</b><span>${Math.round(diag * 2.54)} cm · ${n} ${n === 1 ? "modelis" : "modeļi"}</span>`
  : `<b>Cits</b><span>izmērs nav norādīts · ${n}</span>`;

function tableRow(r, ops) {
  const cells = ops.map(op => {
    const p = r.prices[op], me = op === state.me ? " me" : "";
    if (!p) return `<td class="op${me}" data-op="${OPS[op]}"><span class="na">–</span></td>`;
    const win = r.winners.includes(op);
    return `<td class="op${me}${win ? " wincell" : ""}" data-op="${OPS[op]}">${p.from ? '<span class="from">no</span>' : ""}<span class="p${win ? " win" : ""}">${eur(p.v)}</span>${p.sale ? '<span class="tag">akcija</span>' : ""}
      <span class="m">${p.m != null ? eur(p.m) + " mēnesī" : ""}${state.changes && p.delta ? ` <span class="${p.delta < 0 ? "dn" : "upc"}">${deltaTxt(p.delta)}</span>` : ""}</span></td>`;
  }).join("");
  return `<tr data-key="${esc(r.key)}" data-vk="${esc(r.vk)}" tabindex="0"><td>${rowMeta(r)}</td>${cells}
    <td class="gapc">${r.diff ? `<span class="gap">${eur0(r.diff)}</span>${r.diffVk && state.cat !== "televizori" ? `<span class="m">${esc(r.diffVk)}</span>` : ""}` : ""}</td></tr>`;
}

function moreBtn(total) {
  const left = total - state.limit;
  return left > 0 ? `<div class="more"><button type="button" data-more>Rādīt vēl ${Math.min(PAGE, left)}<span>no ${total}</span></button></div>` : "";
}

function renderRows() {
  let rows = filterRows(allRows());
  // diagonāles filtrs + skaits
  const sizesRow = document.getElementById("sizesRow");
  if (state.cat === "televizori" && state.view !== "list") {
    sizesRow.hidden = false;
    const n = {}; for (const r of rows) if (r.diag) n[r.diag] = (n[r.diag] || 0) + 1;
    document.getElementById("sizes").innerHTML = `<button type="button" class="chip" data-diag="" aria-pressed="${!state.diag}">Visi</button>` +
      Object.keys(n).map(Number).sort((a, b) => a - b).map(s =>
        `<button type="button" class="chip" data-diag="${s}" aria-pressed="${state.diag == s}">${s}″ <span class="n">${n[s]}</span></button>`).join("");
    if (state.diag) rows = rows.filter(r => r.diag == state.diag);
  } else sizesRow.hidden = true;

  rows.forEach(r => { r.meg = meGap(r); });
  sortRows(rows);
  renderMeBand(rows);
  const total = rows.length, tv = state.cat === "televizori";
  const perDiag = {}; for (const r of rows) perDiag[r.diag] = (perDiag[r.diag] || 0) + 1;
  const shown = rows.slice(0, state.limit);
  const ttl = tv && state.diag ? `${state.diag}″ televizori` : state.cat ? CATS[state.cat] : "Visas preces";
  document.getElementById("secTitle").textContent = ttl;
  document.getElementById("secSub").textContent = `${total} ${total === 1 ? "modelis" : "modeļi"}` +
    (state.onlyMine && state.me ? ` ${OPS[state.me]} piedāvājumā` : "") + (state.multi ? " vismaz 2 veikalos" : "");
  const body = document.getElementById("body");
  if (!shown.length) { body.innerHTML = `<p class="empty">Nekas neatbilst. Notīri meklēšanu vai noņem kādu filtru.</p>`; return; }

  if (state.view === "ladder") {
    let html = "", last;
    for (const r of shown) {
      if (tv && r.diag !== last) { last = r.diag; html += `<div class="sec">${secHead(r.diag, perDiag[r.diag])}</div>`; }
      html += ladderRow(r);
    }
    body.innerHTML = html + moreBtn(total);
  } else {
    const ops = opsAll();
    let html = "", last;
    for (const r of shown) {
      if (tv && r.diag !== last) { last = r.diag; html += `<tr class="secrow"><td colspan="${ops.length + 2}">${secHead(r.diag, perDiag[r.diag])}</td></tr>`; }
      html += tableRow(r, ops);
    }
    body.innerHTML = `<table class="tbl"><thead><tr><th scope="col">Modelis</th>${ops.map(op =>
      `<th scope="col" class="${op === state.me ? "me" : ""}"><span class="dot ${op}"></span>${OPS[op]}</th>`).join("")}<th scope="col">Starpība</th></tr></thead>
      <tbody>${html}</tbody></table>` + moreBtn(total);
  }
}

function renderMeBand(rows) {
  const el = document.getElementById("meband"), me = state.me;
  if (!me || state.view === "list") { el.innerHTML = ""; return; }
  const gs = rows.map(r => r.meg).filter(Boolean);
  const cheap = gs.filter(g => g.gap < -0.005).length, same = gs.filter(g => Math.abs(g.gap) < 0.005).length;
  const dear = gs.filter(g => g.gap > 0.005), avg = dear.length ? dear.reduce((s, g) => s + g.pct, 0) / dear.length : null;
  const missing = rows.filter(r => !r.prices[me]).length;
  el.innerHTML = `<div class="meband"><span class="who"><span class="dot ${me}"></span>${OPS[me]}</span>
    <span>lētākais <b>${cheap}</b></span><span>vienāds <b>${same}</b></span>
    <span>dārgāks <b>${dear.length}</b>${avg != null ? `, vidēji +${pct1(avg)}` : ""}</span>
    ${missing ? `<span>nav <b>${missing}</b> modeļos, kas ir citiem</span>` : ""}</div>`;
}

function renderList() {
  document.getElementById("sizesRow").hidden = true;
  renderMeBand([]);
  let list = ITEMS.filter(p => baseFilter(p) && (!state.onlyMine || !state.me || p.operator === state.me) && (!state.sale || onSale(p)));
  const nm = (a, b) => a.name.localeCompare(b.name, "lv") || a.operator.localeCompare(b.operator);
  list.sort((a, b) => (isUsed(a) - isUsed(b)) || (state.sort === "price" ? (a.full ?? Infinity) - (b.full ?? Infinity)
    : state.sort === "diff" ? (b.disc ?? -1) - (a.disc ?? -1) || nm(a, b) : nm(a, b)));
  const total = list.length;
  document.getElementById("secTitle").textContent = state.cat ? CATS[state.cat] : "Visas preces";
  document.getElementById("secSub").textContent = `${total} preces${state.onlyMine && state.me ? " " + OPS[state.me] : " visos veikalos"}, katra atsevišķi`;
  list = list.slice(0, state.limit);
  const body = document.getElementById("body");
  if (!list.length) { body.innerHTML = `<p class="empty">Nekas neatbilst. Notīri meklēšanu vai noņem kādu filtru.</p>`; return; }
  body.innerHTML = `<table class="tbl list"><thead><tr><th scope="col">Prece</th><th scope="col">Cena</th><th scope="col">Mēnesī</th><th scope="col">Zemākā vēsturē</th></tr></thead><tbody>` +
    list.map(p => `<tr data-key="${esc(p.key)}" tabindex="0">
      <td><div class="lm"><span class="b"><span class="dot ${p.operator}"></span> ${OPS[p.operator]} · ${esc(p.brand)}${state.cat ? "" : " · " + CATS[p.category]}</span>
        <span class="t">${esc(p.model)}${isUsed(p) ? '<span class="used">lietots</span>' : ""}</span></div></td>
      <td class="lp"><span class="p">${eur(p.full)}</span>${p.full_old ? ` <s class="m" style="display:inline">${eur(p.full_old)}</s>` : ""}${onSale(p) ? '<span class="tag">akcija</span>' : ""}</td>
      <td class="lp">${p.monthly != null ? eur(p.monthly) : ""}</td>
      <td class="lp">${p.min != null && p.min < p.full ? `<span class="dn">${eur(p.min)}</span>` : ""}</td></tr>`).join("") +
    `</tbody></table>` + moreBtn(total);
}

/* ---------- Analīze: kurš operators kur lētāks ---------- */
// Salīdzināšanas vienība = viens modelis, kas ir vismaz 2 veikalos, vienā un tajā pašā variantā
// (telefoniem/planšetēm atmiņa, pulksteņiem izmērs, televizoriem konkrēts SKU).
function compUnits(cat) {
  const out = [];
  for (const c of cat ? [cat] : Object.keys(CATS)) {
    const items = ITEMS.filter(p => p.category === c && !isUsed(p) && p.full != null);
    if (!items.length) continue;
    if (c === "televizori") {
      for (const r of tvRows(items)) if (r.nOps > 1)
        out.push({ cat: c, brand: r.brand, name: `${r.brand} ${r.title || r.code}`, key: r.key, vk: r.diag ? r.diag + "″" : "",
          prices: Object.fromEntries(Object.entries(r.byOp).map(([op, u]) => [op, u.full])) });
      continue;
    }
    for (const g of buildGroups(items)) {
      if (g.nOps < 2) continue;
      const byVk = {};
      for (const r of skuRows(g)) { const m = (byVk[r.vk] ||= {}); m[r.op] = Math.min(m[r.op] ?? Infinity, r.full); }
      const best = Object.entries(byVk).sort((a, b) => Object.keys(b[1]).length - Object.keys(a[1]).length || vkOrder(a[0]) - vkOrder(b[0]))[0];
      if (!best || Object.keys(best[1]).length < 2) continue;
      out.push({ cat: c, brand: g.items[0].brandN, name: `${g.items[0].brandN} ${g.model}`, key: g.items[0].key, vk: best[0], prices: best[1] });
    }
  }
  for (const u of out) {
    const v = Object.values(u.prices);
    u.min = Math.min(...v); u.max = Math.max(...v); u.tie = u.min === u.max;
  }
  return out;
}

// operatora rādītāji vienību kopā
function opStats(units, op) {
  const mine = units.filter(u => u.prices[op] != null);
  const win = mine.filter(u => !u.tie && u.prices[op] === u.min).length;
  const solo = mine.filter(u => !u.tie && u.prices[op] === u.min && Object.values(u.prices).filter(v => v === u.min).length === 1).length;
  const prem = mine.length ? mine.reduce((s, u) => s + (u.prices[op] - u.min) / u.min, 0) / mine.length * 100 : null;
  return { n: mine.length, win, solo, share: mine.length ? win / mine.length * 100 : null, prem };
}

const pct = v => v == null ? "–" : fmtNum(Math.round(v), 0) + " %";
const pct1 = v => v == null ? "–" : (v < 0.05 ? "0" : fmtNum(Math.round(v * 10) / 10, v < 10 ? 1 : 0)) + " %";

function matrix(rows, ops, label) {
  // rows: [{label, units}] – šūnā: cik bieži lētākais + vidējā piemaksa
  return `<div class="tblwrap"><table class="tbl mx"><thead><tr><th scope="col">${label}</th>${ops.map(op =>
    `<th scope="col"><span class="dot ${op}"></span>${OPS[op]}</th>`).join("")}<th scope="col">Modeļi</th></tr></thead><tbody>` +
    rows.map(r => {
      const st = Object.fromEntries(ops.map(op => [op, opStats(r.units, op)]));
      const cands = ops.filter(op => st[op].n >= 2);
      const top = cands.length > 1 ? cands.reduce((a, b) => (st[b].share - st[a].share || st[a].prem - st[b].prem) > 0 ? b : a) : null;
      return `<tr><th scope="row">${esc(r.label)}</th>${ops.map(op => {
        const s = st[op];
        if (!s.n) return `<td class="op" data-op="${OPS[op]}"><span class="na">–</span></td>`;
        return `<td class="op${op === top ? " wincell" : ""}" data-op="${OPS[op]}"><span class="p${op === top ? " win" : ""}">${pct(s.share)}</span>
          <span class="m">${s.prem < 0.05 ? "vienmēr lētākais" : "+" + pct1(s.prem) + " pret lētāko"} · ${s.n}</span></td>`;
      }).join("")}<td class="gapc"><span class="m" style="display:inline">${r.units.length}</span></td></tr>`;
    }).join("") + `</tbody></table></div>`;
}

function renderAnalysis() {
  const el = document.getElementById("an");
  const cats = Object.keys(CATS).filter(c => ITEMS.some(p => p.category === c));
  if (state.acat && !cats.includes(state.acat)) state.acat = "";
  const scope = state.acat;
  const units = compUnits(scope);
  const ops = opsAll();
  const inScope = ITEMS.filter(p => (!scope || p.category === scope) && !isUsed(p));
  const scopeName = scope ? CATS[scope].toLowerCase() : "visas kategorijas";

  // 1. kopvērtējums
  const st = Object.fromEntries(ops.map(op => [op, opStats(units, op)]));
  const extra = Object.fromEntries(ops.map(op => {
    const its = inScope.filter(p => p.operator === op);
    let dn = 0, up = 0;
    for (const p of its) { const v = prevPrice(p); if (v != null && p.full != null && v !== p.full) v > p.full ? dn++ : up++; }
    const sale = its.filter(onSale);
    const disc = sale.map(p => p.full_old && p.full ? (p.full_old - p.full) / p.full_old * 100 : null).filter(v => v > 0);
    return [op, { total: its.length, sale: its.length ? sale.length / its.length * 100 : 0,
      disc: disc.length ? disc.reduce((a, b) => a + b, 0) / disc.length : null, dn, up }];
  }));
  const ranked = [...ops].sort((a, b) => (st[b].share ?? -1) - (st[a].share ?? -1));
  const lead = ranked[0], cheapPrem = [...ops].filter(op => st[op].n).sort((a, b) => st[a].prem - st[b].prem)[0];
  const maxShare = Math.max(...ops.map(op => st[op].share || 0), 1);

  const score = `<table class="tbl score"><thead><tr><th scope="col">Operators</th><th scope="col">Lētākais</th><th scope="col">Vidēji dārgāks par lētāko</th>
    <th scope="col">Salīdzināmi</th><th scope="col">Akcijās</th><th scope="col">7 dienās</th></tr></thead><tbody>` +
    ranked.map(op => { const s = st[op], x = extra[op];
      return `<tr${op === state.me ? ' class="me"' : ""}><th scope="row"><span class="opn"><span class="dot ${op}"></span>${OPS[op]}</span></th>
        <td class="barc"><span class="big num">${pct(s.share)}</span><span class="bar"><i style="width:${(s.share || 0) / maxShare * 100}%;background:var(--${op})"></i></span>
          <span class="m">${s.win} no ${s.n} modeļiem${s.solo < s.win ? `, ${s.solo} vienīgais lētākais` : ""}</span></td>
        <td><span class="p">${s.n ? "+" + pct1(s.prem) : "–"}</span><span class="m">vidēji pret lētāko</span></td>
        <td><span class="p">${s.n}</span><span class="m">no ${x.total} precēm</span></td>
        <td><span class="p">${pct(x.sale)}</span><span class="m">${x.disc ? "vid. atlaide " + pct(x.disc) : ""}</span></td>
        <td><span class="p"><span class="dn">▼ ${x.dn}</span> <span class="upc">▲ ${x.up}</span></span><span class="m">cenas mainījās</span></td></tr>`;
    }).join("") + `</tbody></table>`;

  // 2. pa kategorijām (tikai, ja skatās visu)
  const byCat = scope ? "" : panel("Pa kategorijām", "Cik bieži operators ir lētākais katrā kategorijā. Dzeltenā šūna – labākais kategorijā.",
    matrix(cats.map(c => ({ label: CATS[c], units: units.filter(u => u.cat === c) })).filter(r => r.units.length), ops, "Kategorija"));

  // 3. pa ražotājiem
  const brandN = {};
  for (const u of units) brandN[u.brand] = (brandN[u.brand] || 0) + 1;
  const brands = Object.entries(brandN).filter(([, n]) => n >= 3).sort((a, b) => b[1] - a[1]).slice(0, 16).map(([b]) => b);
  const byBrand = brands.length ? panel("Pa ražotājiem", `Ražotāji ar vismaz 3 salīdzināmiem modeļiem (${scopeName}). Dzeltenā šūna – kur šī ražotāja preces visbiežāk lētākas.`,
    matrix(brands.map(b => ({ label: b, units: units.filter(u => u.brand === b) })), ops, "Ražotājs")) : "";

  // 4. divi pret divi
  const pairs = [];
  for (let i = 0; i < ops.length; i++) for (let j = i + 1; j < ops.length; j++) pairs.push([ops[i], ops[j]]);
  const pairRank = x => state.me ? (x.includes(state.me) ? 0 : 1) : (x.join() === "bite,tele2" ? 0 : 1);
  pairs.sort((x, y) => pairRank(x) - pairRank(y));
  const duel = pairs.map(([a, b]) => {
    const com = units.filter(u => u.prices[a] != null && u.prices[b] != null);
    if (!com.length) return "";
    const aw = com.filter(u => u.prices[a] < u.prices[b]).length, bw = com.filter(u => u.prices[b] < u.prices[a]).length, eq = com.length - aw - bw;
    const avg = com.reduce((s, u) => s + (u.prices[a] - u.prices[b]), 0) / com.length;
    const cheaper = avg < 0 ? a : b;
    return `<div class="duel"><div class="dh"><b>${OPS[a]} pret ${OPS[b]}</b><span>${com.length} kopīgi modeļi · ${Math.abs(avg) < 1 ? "vidēji gandrīz vienādi" : `vidēji lētāks ${OPS[cheaper]} par ${eur0(Math.abs(avg))}`}</span></div>
      <div class="split" role="img" aria-label="${OPS[a]} lētāks ${aw}, vienādi ${eq}, ${OPS[b]} lētāks ${bw}">
        <i style="flex:${aw};background:var(--${a})"></i><i style="flex:${eq};background:var(--line)"></i><i style="flex:${bw};background:var(--${b})"></i></div>
      <div class="sl"><span><span class="dot ${a}"></span>${OPS[a]} lētāks <b>${aw}</b></span><span>vienādi <b>${eq}</b></span><span>${OPS[b]} lētāks <b>${bw}</b><span class="dot ${b}"></span></span></div></div>`;
  }).join("");

  // 5. lielākie ietaupījumi katram operatoram
  const saves = ops.map(op => {
    const list = units.filter(u => u.prices[op] === u.min && Object.values(u.prices).filter(v => v === u.min).length === 1)
      .map(u => ({ u, gap: Math.min(...Object.entries(u.prices).filter(([o]) => o !== op).map(([, v]) => v)) - u.min }))
      .sort((a, b) => b.gap - a.gap).slice(0, 4);
    return `<div class="save"><h3><span class="dot ${op}"></span>${OPS[op]}</h3>${list.length ? `<ol>${list.map(({ u, gap }) =>
      `<li><button type="button" class="lnk" data-key="${esc(u.key)}" data-vk="${esc(u.vk)}"><span>${esc(u.name)}${u.vk ? ` <span class="m">${esc(u.vk)}</span>` : ""}</span>
        <span class="num"><b>${eur(u.prices[op])}</b> <span class="dn">−${eur0(gap)}</span></span></button></li>`).join("")}</ol>`
      : `<p class="quiet">Nevienā modelī nav vienīgais lētākais.</p>`}</div>`;
  }).join("");

  // 6. sortiments
  const sortRowsA = (scope ? [scope] : cats).map(c => {
    const its = ITEMS.filter(p => p.category === c && !isUsed(p));
    const groups = c === "televizori" ? tvRows(its).map(r => Object.keys(r.byOp)) : buildGroups(its).map(g => Object.keys(g.byOp));
    return `<tr><th scope="row">${CATS[c]}</th>${ops.map(op => {
      const n = groups.filter(g => g.includes(op)).length, ex = groups.filter(g => g.length === 1 && g[0] === op).length;
      return `<td class="op" data-op="${OPS[op]}"><span class="p">${n || "–"}</span><span class="m">${ex ? ex + " tikai šeit" : ""}</span></td>`;
    }).join("")}<td class="gapc"><span class="m" style="display:inline">${groups.length}</span></td></tr>`;
  }).join("");
  const assort = `<div class="tblwrap"><table class="tbl mx"><thead><tr><th scope="col">Kategorija</th>${ops.map(op =>
    `<th scope="col"><span class="dot ${op}"></span>${OPS[op]}</th>`).join("")}<th scope="col">Kopā</th></tr></thead><tbody>${sortRowsA}</tbody></table></div>`;

  el.innerHTML = `
    <section class="hero">
      <h1>Kurš lētāks?</h1>
      <p class="lead">${units.length
        ? `Salīdzināti <b>${units.length}</b> modeļi, kas ir pieejami vismaz divos veikalos, vienā un tajā pašā variantā (${scopeName}). Visbiežāk lētākais ir <b>${OPS[lead]}</b>: ${pct(st[lead].share)} no modeļiem, ko tas piedāvā.${cheapPrem && cheapPrem !== lead ? ` Mazākā vidējā piemaksa pret lētāko ir <b>${OPS[cheapPrem]}</b>: +${pct1(st[cheapPrem].prem)}.` : ""}${state.me && st[state.me]?.n && state.me !== lead ? ` <b>${OPS[state.me]}</b>: lētākais ${pct(st[state.me].share)} modeļu, vidēji +${pct1(st[state.me].prem)} pret lētāko.` : ""}`
        : "Šajā kategorijā vēl nav modeļu, kas būtu vairākos veikalos."}</p>
      <div class="frow"><span class="flabel">Kategorija</span><div class="chips scroll" id="acats" role="group" aria-label="Kategorija">
        <button type="button" class="chip" data-acat="" aria-pressed="${!scope}">Visas</button>${cats.map(c =>
          `<button type="button" class="chip" data-acat="${c}" aria-pressed="${scope === c}">${CATS[c]}</button>`).join("")}</div></div>
    </section>
    ${units.length ? panel("Kopvērtējums", "“Lētākais” – cik daļā no salīdzināmajiem modeļiem operatora cena ir zemākā (arī dalīta). “Vidēji dārgāks” – cik procentos vidēji jāpiemaksā salīdzinājumā ar lētāko veikalu.", score, "score-wrap") : ""}
    ${units.length ? byCat : ""}
    ${units.length ? byBrand : ""}
    ${duel ? panel("Divi pret divi", "Tikai modeļi, kas ir abos veikalos. Joslas krāsa – kurš lētāks.", `<div class="duels">${duel}</div>`) : ""}
    ${units.length ? panel("Kur operators ir vienīgais lētākais", "Modeļi, kur operators ir vienīgais lētākais, un par cik lētāks nekā nākamais veikals. Uzspied, lai salīdzinātu.", `<div class="saves">${saves}</div>`) : ""}
    ${panel("Sortiments", "Cik dažādus modeļus piedāvā katrs operators un cik no tiem nav nevienā citā veikalā.", assort)}
    <p class="foot">Analīze balstās uz pēdējās skenēšanas cenām (${esc(fmtDT(NOW))}). Pilnā cena bez līguma; mēneša maksājumi nav ņemti vērā. Lietotas un izpakotas preces nav iekļautas.</p>`;
}

const panel = (title, sub, body, cls = "") => `<section class="card panel ${cls}"><div class="card-head"><div class="ttl"><h2>${title}</h2></div><p class="psub">${sub}</p></div>${body}</section>`;

    : "Datu vēl nav. Palaid skenēšanu GitHub Actions cilnē.";
