<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>tele2.lv</title>
<!-- edge VEIDNE www.tele2.lv: pārbaudes lapa bez teksta — tikai progresa josla lapas augšā. Obligāti: core, bar; status un details paslēpti. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  .track { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: #1a1a1a; overflow: hidden; }
  .track [data-edge="bar"] { background: #0086ff; box-shadow: 0 0 8px #0086ff; transition: width .25s; }
  .hid { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  noscript p { margin: 40vh auto 0; max-width: 480px; text-align: center; font: 15px/1.4 Arial, sans-serif; color: #999; }
</style>
</head>
<body>
  <div class="track"><i data-edge="bar" style="display:block;height:100%;width:0"></i></div>
  <span class="hid"><span data-edge="status"></span></span>
  <span class="hid"><span data-edge="details"></span></span>
  <noscript><p>Pārbaudei vajadzīgs JavaScript. Ieslēdziet to pārlūkā un pārlādējiet lapu.</p></noscript>
<script src="/.edge/core/anubis-page.js"></script>
</body>
</html>
